<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc">
  <title id="title">Two-CTA cluster DSM histogram lifecycle</title>
  <desc id="desc">Two CTAs initialize their own shared bins, synchronize cluster-wide, atomically update the owning CTA's bins through distributed shared memory, synchronize again before reading or exiting, then export results.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#43536b"/></marker>
    <style>
      .bg{fill:#f7f9fc}.panel{fill:#fff;stroke:#60738a;stroke-width:2}.phase{fill:#e7eef9;stroke:#5a76a6;stroke-width:2}.dsm{fill:#fff1d7;stroke:#c18119;stroke-width:2}.fence{fill:#e4f4ed;stroke:#338264;stroke-width:2}.txt{font:17px 'Segoe UI',Arial,sans-serif;fill:#15263b}.small{font:14px 'Segoe UI',Arial,sans-serif;fill:#34465c}.head{font:700 21px 'Segoe UI',Arial,sans-serif;fill:#15263b}.arrow{stroke:#43536b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dash{stroke:#b27615;stroke-width:2.5;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1040" height="560" rx="18"/>
  <text class="head" x="32" y="40">One cluster = two concurrently resident CTAs in one GPC</text>
  <rect class="panel" x="34" y="68" width="450" height="300" rx="14"/>
  <rect class="panel" x="556" y="68" width="450" height="300" rx="14"/>
  <text class="head" x="58" y="103">CTA rank 0</text>
  <text class="head" x="580" y="103">CTA rank 1</text>
  <rect class="phase" x="60" y="124" width="398" height="72" rx="10"/>
  <rect class="phase" x="582" y="124" width="398" height="72" rx="10"/>
  <text class="txt" x="82" y="153">Initialize own shared bins [0..15]</text>
  <text class="small" x="82" y="178">shared is local storage, zeroed by CTA 0</text>
  <text class="txt" x="604" y="153">Initialize own shared bins [16..31]</text>
  <text class="small" x="604" y="178">shared is local storage, zeroed by CTA 1</text>
  <rect class="fence" x="292" y="213" width="456" height="54" rx="12"/>
  <text class="txt" x="323" y="246">cluster.sync() - all shared arrays initialized</text>
  <path class="arrow" d="M258 196 L388 211"/><path class="arrow" d="M782 196 L652 211"/>
  <rect class="dsm" x="60" y="286" width="398" height="60" rx="10"/>
  <rect class="dsm" x="582" y="286" width="398" height="60" rx="10"/>
  <text class="txt" x="82" y="312">map_shared_rank(..., 0)</text>
  <text class="small" x="82" y="334">local atomic updates bins 0..15</text>
  <text class="txt" x="604" y="312">map_shared_rank(..., 1)</text>
  <text class="small" x="604" y="334">local atomic updates bins 16..31</text>
  <path class="dash" d="M446 300 C500 270 540 270 594 300"/>
  <path class="dash" d="M594 333 C540 360 500 360 446 333"/>
  <text class="small" x="461" y="291">DSM remote atomic</text>
  <rect class="fence" x="292" y="389" width="456" height="62" rx="12"/>
  <text class="txt" x="321" y="416">cluster.sync() - remote updates complete</text>
  <text class="small" x="324" y="438">only now may owner bins be read or CTA exit</text>
  <path class="arrow" d="M258 346 C270 372 305 380 350 388"/><path class="arrow" d="M782 346 C770 372 735 380 690 388"/>
  <rect class="phase" x="111" y="473" width="818" height="58" rx="12"/>
  <text class="txt" x="158" y="509">Each CTA exports its own 16-bin slice; clusters atomically combine into global histogram</text>
  <path class="arrow" d="M450 451 L450 470"/><path class="arrow" d="M590 451 L590 470"/>
</svg>
