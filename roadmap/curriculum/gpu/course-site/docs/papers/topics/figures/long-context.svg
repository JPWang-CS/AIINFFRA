<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470" role="img" aria-labelledby="t d">
<title id="t">长上下文方法改变位置、注意力边或历史表示</title><desc id="d">RoPE缩放改变位置相位；窗口稀疏改变注意力边；KV压缩减少缓存字节；有限状态压缩历史。各方法分别接受质量与成本评估。</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.b{stroke-width:2;rx:14}.x{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#a)}.h{font-size:20px;font-weight:700}.s{font-size:16px}</style></defs>
<rect width="1080" height="470" fill="#f8fafc"/><text x="40" y="42" class="h">长上下文不是一个单独的长度参数</text>
<rect x="45" y="100" width="235" height="110" class="b" fill="#dbeafe" stroke="#3b82f6"/><text x="162" y="140" text-anchor="middle" class="h">RoPE scaling</text><text x="162" y="173" text-anchor="middle" class="s">改变相位外推</text>
<rect x="305" y="100" width="235" height="110" class="b" fill="#ede9fe" stroke="#8b5cf6"/><text x="422" y="140" text-anchor="middle" class="h">窗口 / 稀疏</text><text x="422" y="173" text-anchor="middle" class="s">删减注意力边</text>
<rect x="565" y="100" width="235" height="110" class="b" fill="#ffedd5" stroke="#f97316"/><text x="682" y="140" text-anchor="middle" class="h">KV 压缩</text><text x="682" y="173" text-anchor="middle" class="s">减少每 token 缓存字节</text>
<rect x="825" y="100" width="210" height="110" class="b" fill="#dcfce7" stroke="#22c55e"/><text x="930" y="140" text-anchor="middle" class="h">有限状态</text><text x="930" y="173" text-anchor="middle" class="s">压缩整段历史</text>
<rect x="200" y="286" width="680" height="88" class="b" fill="#fee2e2" stroke="#ef4444"/><text x="540" y="321" text-anchor="middle" class="h">分别评估质量与成本</text><text x="540" y="351" text-anchor="middle" class="s">训练长度内 / 外推、远距检索、PPL、KV bytes、prefill/decode</text>
<path d="M162 210V252M422 210V252M682 210V252M930 210V252M162 252H930" fill="none" stroke="#475569" stroke-width="2.5"/><path d="M546 252V280" class="x"/>
<text x="540" y="426" text-anchor="middle" class="s">位置范围扩大 ≠ 计算减少；边变少 ≠ 历史压缩</text></svg>
