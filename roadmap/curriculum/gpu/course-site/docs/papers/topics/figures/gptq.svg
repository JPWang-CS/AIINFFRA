<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470" role="img" aria-labelledby="t d">
<title id="t">GPTQ以校准输入固定Hessian并补偿未量化权重</title>
<desc id="d">校准输入X预先形成固定H=X转置X。逐列量化得到q_i后计算e_i=w_i-q_i，使用H逆列方向更新其余尚未量化的权重，不修改H。</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.b{stroke-width:2;rx:14}.x{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#a)}.h{font-size:20px;font-weight:700}.s{font-size:16px}</style></defs>
<rect width="1080" height="470" fill="#f8fafc"/><text x="40" y="42" class="h">H 由校准输入固定；量化误差补偿未量化权重</text>
<rect x="45" y="90" width="175" height="78" class="b" fill="#dbeafe" stroke="#3b82f6"/><text x="132" y="123" text-anchor="middle" class="h">校准输入 X</text><text x="132" y="149" text-anchor="middle" class="s">n × dᵢₙ</text>
<path d="M220 129H278" class="x"/><rect x="290" y="90" width="190" height="78" class="b" fill="#ede9fe" stroke="#8b5cf6"/><text x="385" y="123" text-anchor="middle" class="h">H = XᵀX</text><text x="385" y="149" text-anchor="middle" class="s">校准方向度量</text>
<path d="M480 129H538" class="x"/><rect x="550" y="90" width="250" height="78" class="b" fill="#e2e8f0" stroke="#64748b"/><text x="675" y="123" text-anchor="middle" class="h">固定的二次目标</text><text x="675" y="149" text-anchor="middle" class="s">H 在权重量化过程中不变</text>
<rect x="45" y="272" width="145" height="78" class="b" fill="#dbeafe" stroke="#3b82f6"/><text x="117" y="306" text-anchor="middle" class="h">当前元素 wᵢ</text><text x="117" y="332" text-anchor="middle" class="s">所在列正在量化</text>
<path d="M190 311H238" class="x"/><rect x="250" y="272" width="170" height="78" class="b" fill="#ffedd5" stroke="#f97316"/><text x="335" y="306" text-anchor="middle" class="h">舍入 qᵢ</text><text x="335" y="332" text-anchor="middle" class="s">固定当前坐标</text>
<path d="M420 311H458" class="x"/><rect x="470" y="272" width="145" height="78" class="b" fill="#fee2e2" stroke="#ef4444"/><text x="542" y="306" text-anchor="middle" class="h">eᵢ = wᵢ − qᵢ</text><text x="542" y="332" text-anchor="middle" class="s">本列量化误差</text>
<path d="M615 311H643" class="x"/><rect x="655" y="250" width="235" height="122" class="b" fill="#fef3c7" stroke="#d97706"/><text x="772" y="288" text-anchor="middle" class="h">二阶误差补偿</text><text x="772" y="318" text-anchor="middle" class="s">δ = −eᵢ H⁻¹[:,i] / H⁻¹ᵢᵢ</text><text x="772" y="346" text-anchor="middle" class="s">H 由 X 固定提供方向</text>
<path d="M890 311H913" class="x"/><rect x="925" y="272" width="135" height="78" class="b" fill="#dcfce7" stroke="#22c55e"/><text x="992" y="306" text-anchor="middle" class="h">更新 wⱼ</text><text x="992" y="332" text-anchor="middle" class="s">其余元素</text>
<path d="M675 168V226H772V244" class="x"/><text x="540" y="420" text-anchor="middle" class="s">最小化 ‖XW − XŴ‖²；补偿沿校准输入相关方向分配</text>
</svg>
