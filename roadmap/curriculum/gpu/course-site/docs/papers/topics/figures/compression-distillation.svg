<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="460" viewBox="0 0 1080 460" role="img" aria-labelledby="t d">
<title id="t">蒸馏、剪枝和低秩分解改变不同模型对象</title><desc id="d">蒸馏用teacher概率监督student；剪枝移除权重或结构；SVD低秩分解用U、Sigma和V转置近似稠密矩阵。</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.b{stroke-width:2;rx:14}.x{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#a)}.h{font-size:20px;font-weight:700}.s{font-size:16px}</style></defs>
<rect width="1080" height="460" fill="#f8fafc"/><text x="40" y="42" class="h">三种方法压缩不同对象</text>
<rect x="45" y="100" width="290" height="280" class="b" fill="#eff6ff" stroke="#3b82f6"/><text x="190" y="139" text-anchor="middle" class="h">蒸馏</text><rect x="82" y="171" width="96" height="62" class="b" fill="#dbeafe" stroke="#3b82f6"/><text x="130" y="209" text-anchor="middle" class="s">Teacher</text><rect x="204" y="171" width="96" height="62" class="b" fill="#dcfce7" stroke="#22c55e"/><text x="252" y="209" text-anchor="middle" class="s">Student</text><path d="M178 202H195" class="x"/><text x="190" y="274" text-anchor="middle" class="s">匹配温度概率 / logits</text><text x="190" y="313" text-anchor="middle" class="s">迁移函数行为</text>
<rect x="395" y="100" width="290" height="280" class="b" fill="#fff7ed" stroke="#f97316"/><text x="540" y="139" text-anchor="middle" class="h">剪枝</text><rect x="445" y="174" width="190" height="84" class="b" fill="#ffedd5" stroke="#f97316"/><text x="540" y="210" text-anchor="middle" class="h">稠密结构</text><text x="540" y="237" text-anchor="middle" class="s">权重 / 通道 / 头</text><path d="M540 258V288" class="x"/><text x="540" y="323" text-anchor="middle" class="s">置零或删除结构</text>
<rect x="745" y="100" width="290" height="280" class="b" fill="#f5f3ff" stroke="#8b5cf6"/><text x="890" y="139" text-anchor="middle" class="h">低秩分解</text><rect x="760" y="183" width="72" height="74" class="b" fill="#ede9fe" stroke="#8b5cf6"/><text x="796" y="228" text-anchor="middle" class="h">Uᵣ</text><text x="842" y="228" text-anchor="middle" class="h">×</text><rect x="855" y="183" width="72" height="74" class="b" fill="#ddd6fe" stroke="#8b5cf6"/><text x="891" y="228" text-anchor="middle" class="h">Σᵣ</text><text x="937" y="228" text-anchor="middle" class="h">×</text><rect x="950" y="183" width="72" height="74" class="b" fill="#ede9fe" stroke="#8b5cf6"/><text x="986" y="228" text-anchor="middle" class="h">Vᵣᵀ</text><text x="890" y="310" text-anchor="middle" class="s">近似权重矩阵 W</text>
<text x="540" y="426" text-anchor="middle" class="s">压缩率与实际速度分开测；硬件 kernel 决定稀疏或分解是否获益</text></svg>
