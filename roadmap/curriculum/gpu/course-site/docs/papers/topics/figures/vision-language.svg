<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="t d"><title id="t">视觉语言模型的三种核心数据路径</title><desc id="d">ViT把图像切成patch token并编码；CLIP分别编码图像和文本并以对比损失对齐；LLaVA将视觉向量投影到语言模型宽度后用于自回归生成。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.b{stroke-width:2;rx:14}.x{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#a)}.h{font-size:20px;font-weight:700}.s{font-size:16px}</style></defs><rect width="1100" height="480" fill="#f8fafc"/><text x="40" y="42" class="h">共同输入接口，训练目标不同</text><rect x="45" y="95" width="280" height="300" class="b" fill="#eff6ff" stroke="#3b82f6"/><text x="185" y="132" text-anchor="middle" class="h">ViT</text><rect x="90" y="166" width="190" height="72" class="b" fill="#dbeafe" stroke="#3b82f6"/><text x="185" y="195" text-anchor="middle" class="s">图像 → patches</text><text x="185" y="220" text-anchor="middle" class="s">N = HW/P²</text><path d="M185 238V272" class="x"/><text x="185" y="307" text-anchor="middle" class="h">Transformer</text><text x="185" y="343" text-anchor="middle" class="s">CLS / patch 表示</text><rect x="410" y="95" width="280" height="300" class="b" fill="#f5f3ff" stroke="#8b5cf6"/><text x="550" y="132" text-anchor="middle" class="h">CLIP</text><rect x="445" y="166" width="94" height="62" class="b" fill="#dbeafe" stroke="#3b82f6"/><text x="492" y="203" text-anchor="middle" class="s">图像塔</text><rect x="571" y="166" width="94" height="62" class="b" fill="#ede9fe" stroke="#8b5cf6"/><text x="618" y="203" text-anchor="middle" class="s">文本塔</text><path d="M492 228V268H550M618 228V268H550V282" class="x"/><text x="550" y="317" text-anchor="middle" class="h">相似度矩阵</text><text x="550" y="350" text-anchor="middle" class="s">双向对比交叉熵</text><rect x="775" y="95" width="280" height="300" class="b" fill="#f0fdf4" stroke="#22c55e"/><text x="915" y="132" text-anchor="middle" class="h">视觉条件生成</text><rect x="815" y="166" width="200" height="62" class="b" fill="#dbeafe" stroke="#3b82f6"/><text x="915" y="203" text-anchor="middle" class="s">视觉 encoder</text><path d="M915 228V257" class="x"/><rect x="815" y="269" width="200" height="62" class="b" fill="#fef3c7" stroke="#d97706"/><text x="915" y="306" text-anchor="middle" class="s">projector → LLM</text><path d="M915 331V356" class="x"/><text x="915" y="382" text-anchor="middle" class="s">回答 token causal loss</text><text x="550" y="445" text-anchor="middle" class="s">高分辨率和多帧会增加视觉 token，从而增加注意力与缓存成本</text></svg>
