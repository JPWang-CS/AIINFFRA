<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">ZeRO 阶段逐步切分模型状态</title>
  <desc id="desc">DP 复制参数、梯度和优化器状态；ZeRO-1 分 optimizer states，ZeRO-2 再分 gradients，ZeRO-3 进一步分参数并在计算前 all-gather、反向后 reduce-scatter。</desc>
  <rect width="1200" height="560" viewBox="0 0 1200 560" fill="#f8fafc"/><text x="48" y="52" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="27" font-weight="700" fill="#0f172a">ZeRO 按阶段移除 DP rank 间的模型状态副本</text>
  <g font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">
    <text x="185" y="112" font-size="20" font-weight="700" fill="#0f172a">DP</text><text x="445" y="112" font-size="20" font-weight="700" fill="#0f172a">ZeRO-1</text><text x="705" y="112" font-size="20" font-weight="700" fill="#0f172a">ZeRO-2</text><text x="965" y="112" font-size="20" font-weight="700" fill="#0f172a">ZeRO-3</text>
    <text x="60" y="170" font-size="16" text-anchor="start" fill="#475569">参数</text><text x="60" y="260" font-size="16" text-anchor="start" fill="#475569">梯度</text><text x="60" y="350" font-size="16" text-anchor="start" fill="#475569">优化器</text>
    <g stroke="#2563eb" stroke-width="2"><rect x="120" y="145" width="130" height="54" fill="#dbeafe"/><rect x="120" y="235" width="130" height="54" fill="#dbeafe"/><rect x="120" y="325" width="130" height="54" fill="#dbeafe"/></g><g font-size="15" fill="#1e3a8a"><text x="185" y="178">full copy</text><text x="185" y="268">full copy</text><text x="185" y="358">full copy</text></g>
    <g stroke="#16a34a" stroke-width="2"><rect x="380" y="145" width="130" height="54" fill="#dbeafe"/><rect x="380" y="235" width="130" height="54" fill="#dbeafe"/><rect x="380" y="325" width="65" height="54" fill="#dcfce7"/><rect x="445" y="325" width="65" height="54" fill="#bbf7d0"/></g><g font-size="15" fill="#1e3a8a"><text x="445" y="178">replicated</text><text x="445" y="268">replicated</text></g><text x="445" y="358" font-size="14" fill="#14532d">sharded</text>
    <g stroke="#16a34a" stroke-width="2"><rect x="640" y="145" width="130" height="54" fill="#dbeafe"/><rect x="640" y="235" width="65" height="54" fill="#dcfce7"/><rect x="705" y="235" width="65" height="54" fill="#bbf7d0"/><rect x="640" y="325" width="65" height="54" fill="#dcfce7"/><rect x="705" y="325" width="65" height="54" fill="#bbf7d0"/></g><text x="705" y="178" font-size="15" fill="#1e3a8a">replicated</text><text x="705" y="268" font-size="14" fill="#14532d">sharded</text><text x="705" y="358" font-size="14" fill="#14532d">sharded</text>
    <g stroke="#16a34a" stroke-width="2"><rect x="900" y="145" width="65" height="54" fill="#dcfce7"/><rect x="965" y="145" width="65" height="54" fill="#bbf7d0"/><rect x="900" y="235" width="65" height="54" fill="#dcfce7"/><rect x="965" y="235" width="65" height="54" fill="#bbf7d0"/><rect x="900" y="325" width="65" height="54" fill="#dcfce7"/><rect x="965" y="325" width="65" height="54" fill="#bbf7d0"/></g><g font-size="14" fill="#14532d"><text x="965" y="178">sharded</text><text x="965" y="268">sharded</text><text x="965" y="358">sharded</text></g>
  </g>
  <text x="1080" y="177" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="14" fill="#475569">forward:</text><text x="1080" y="198" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="14" fill="#475569">all-gather</text><text x="1080" y="267" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="14" fill="#475569">backward:</text><text x="1080" y="288" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="14" fill="#475569">reduce-scatter</text>
  <text x="48" y="455" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16" fill="#475569">此图表示状态归属；实际峰值还包含 all-gather buffer、activation、bucket、预取与重计算。</text><text x="48" y="485" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16" fill="#475569">参数/梯度/optimizer state 的 dtype 与实现决定每项字节数；阶段越深，参数通信与临时驻留越重要。</text>
</svg>
