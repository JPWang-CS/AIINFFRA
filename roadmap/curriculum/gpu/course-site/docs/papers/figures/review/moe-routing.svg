<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">MoE 的可微路由分数与离散 Top-K 派发</title>
  <desc id="desc">hidden state 产生 router logits 和 softmax 概率；离散 Top-K 产生专家索引，路由权重对所选专家输出加权。训练负载损失可通过平均概率回传。</desc>
  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><rect width="1200" height="540" fill="#f8fafc"/><text x="48" y="52" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="27" font-weight="700" fill="#0f172a">MoE 路由：连续分数参与梯度，Top-K 索引负责派发</text>
  <g font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">
    <rect x="40" y="210" width="130" height="78" rx="13" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><text x="105" y="255" font-size="19" fill="#0f172a">hidden x</text>
    <rect x="225" y="210" width="160" height="78" rx="13" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="305" y="243" font-size="18" fill="#0f172a">router logits</text><text x="305" y="270" font-size="15" fill="#1e3a8a">s = xWᵣ</text>
    <rect x="445" y="115" width="185" height="78" rx="13" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="537" y="148" font-size="17" fill="#0f172a">softmax probabilities</text><text x="537" y="175" font-size="15" fill="#14532d">可微分 Pₑ</text>
    <rect x="445" y="305" width="185" height="78" rx="13" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="537" y="338" font-size="18" fill="#0f172a">Top-K indices</text><text x="537" y="365" font-size="15" fill="#78350f">离散选择</text>
    <rect x="700" y="305" width="160" height="78" rx="13" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="780" y="338" font-size="18" fill="#0f172a">dispatch / bucket</text><text x="780" y="365" font-size="15" fill="#7c2d12">按 expert 分组</text>
    <rect x="925" y="270" width="135" height="80" rx="13" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="992" y="304" font-size="18" fill="#0f172a">Experts</text><text x="992" y="332" font-size="15" fill="#4c1d95">E₁…Eₖ</text>
    <rect x="925" y="115" width="210" height="78" rx="13" fill="#fce7f3" stroke="#db2777" stroke-width="2"/><text x="1030" y="148" font-size="17" fill="#0f172a">load loss</text><text x="1030" y="175" font-size="15" fill="#831843">结合分派比例 fₑ 与 Pₑ</text>
    <rect x="925" y="400" width="210" height="78" rx="13" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="1030" y="433" font-size="18" fill="#0f172a">加权合并</text><text x="1030" y="460" font-size="15" fill="#14532d">Σ weightᵢ · Eᵢ(x)</text>
  </g>
  <g fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arr)"><path d="M170 249H220"/><path d="M385 231H410V154H440"/><path d="M385 267H410V344H440"/><path d="M630 344H695"/><path d="M860 344H920V310"/><path d="M537 193V240H924V440" stroke-dasharray="8 7"/><path d="M1060 310V395"/><path d="M630 154H920" stroke-dasharray="8 7"/></g>
  <text x="48" y="510" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16" fill="#475569">Top-K 索引没有普通连续梯度；所选 gate 与专家输出仍参与主损失反传。</text>
</svg>
