<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Single-Pass mHC 使用上一 residual update 的 A 系数</title>
  <desc id="desc">原式用当前 X_l 预测 A_l 再计算 F_l(A_l X_l)，产生依赖。Single-Pass 式把 F 输入改为 A_(l-1)X_l；A_(l-1) 是独立的上一 update 输出，当前 X_l 另用于预测 A_l/B_l/C_l 供下一 update 使用。</desc>
  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><rect width="1200" height="640" fill="#f8fafc"/><text x="48" y="52" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="27" font-weight="700" fill="#0f172a">Single-Pass mHC 改变系数依赖，不是等价融合</text>
  <g font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">
    <rect x="35" y="82" width="550" height="440" rx="16" fill="#fff" stroke="#cbd5e1"/><text x="310" y="120" font-size="22" font-weight="700" fill="#0f172a">原 mHC</text>
    <rect x="615" y="82" width="550" height="440" rx="16" fill="#fff" stroke="#cbd5e1"/><text x="890" y="120" font-size="22" font-weight="700" fill="#0f172a">Single-Pass mHC</text>
    <rect x="65" y="185" width="145" height="72" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="137" y="228" font-size="18" fill="#1e3a8a">当前 Xₗ</text>
    <rect x="270" y="145" width="145" height="72" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="342" y="188" font-size="18" fill="#4c1d95">H(Xₗ)</text>
    <rect x="455" y="145" width="100" height="72" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="505" y="188" font-size="17" fill="#78350f">Aₗ</text>
    <rect x="270" y="295" width="145" height="78" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="342" y="327" font-size="17" fill="#7c2d12">mix</text><text x="342" y="353" font-size="15" fill="#7c2d12">AₗXₗ</text>
    <rect x="455" y="295" width="100" height="78" rx="12" fill="#fce7f3" stroke="#db2777" stroke-width="2"/><text x="505" y="340" font-size="18" fill="#831843">Fₗ</text>
    <text x="310" y="424" font-size="15" fill="#475569">当前 Xₗ → reduction → Aₗ → 当前 Fₗ 输入</text><text x="310" y="454" font-size="14" fill="#64748b">F 输入依赖当前 Xₗ 的系数归约</text>

    <rect x="650" y="150" width="155" height="68" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="727" y="190" font-size="17" fill="#14532d">已知 Aₗ₋₁</text>
    <rect x="650" y="285" width="155" height="68" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="727" y="326" font-size="18" fill="#1e3a8a">当前 Xₗ</text>
    <rect x="850" y="200" width="145" height="80" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="922" y="231" font-size="17" fill="#7c2d12">mix</text><text x="922" y="258" font-size="15" fill="#7c2d12">Aₗ₋₁Xₗ</text>
    <rect x="1040" y="200" width="100" height="80" rx="12" fill="#fce7f3" stroke="#db2777" stroke-width="2"/><text x="1090" y="247" font-size="18" fill="#831843">Fₗ</text>
    <rect x="850" y="330" width="145" height="72" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="922" y="373" font-size="17" fill="#4c1d95">H(Xₗ)</text>
    <rect x="1040" y="320" width="100" height="92" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="1090" y="353" font-size="16" fill="#78350f">Aₗ,Bₗ,Cₗ</text><text x="1090" y="383" font-size="13" fill="#78350f">供下一 update</text>
    <text x="890" y="448" font-size="15" fill="#475569">Aₗ₋₁ 与 Xₗ 是两个输入；Xₗ 另行生成当前系数</text>
  </g>
  <g fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)"><path d="M210 210H245V181H265"/><path d="M415 181H450"/><path d="M210 235H250V334H265"/><path d="M505 217V265H342V290"/><path d="M415 334H450"/>
    <path d="M805 184H845V225"/><path d="M805 319H830V255H845"/><path d="M995 240H1035"/><path d="M805 319H830V366H845"/><path d="M995 366H1035"/>
  </g>
  <rect x="65" y="550" width="1075" height="54" rx="10" fill="#fff7ed" stroke="#fb923c"/><text x="85" y="583" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="17" fill="#7c2d12">Xₗ₊₁ = BₗXₗ + CₗFₗ(Aₗ₋₁Xₗ)：当前 Xₗ 产生 Aₗ/Bₗ/Cₗ，Aₗ 留给下一 residual update。</text>
</svg>
