<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">并行归约的 warp 内与 block 内合并</title>
  <desc id="desc">线程先累加各自元素，warp 内用 shuffle 合并 partial，多个 warp 将 partial 写入 shared memory，同步后再归约得到 block 结果。</desc>
  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><rect width="1200" height="500" fill="#f8fafc"/><text x="48" y="52" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="27" font-weight="700" fill="#0f172a">线程局部累加 → warp reduce → block 合并</text>
  <g font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">
    <rect x="45" y="150" width="200" height="150" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="145" y="188" font-size="19" fill="#0f172a">线程私有 partial</text><text x="145" y="222" font-size="16" fill="#1e3a8a">t₀: x₀+x₄+…</text><text x="145" y="252" font-size="16" fill="#1e3a8a">t₁: x₁+x₅+…</text><text x="145" y="282" font-size="14" fill="#475569">尾部用 mask / identity</text>
    <rect x="325" y="150" width="190" height="150" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="420" y="188" font-size="19" fill="#0f172a">warp reduce</text><text x="420" y="222" font-size="16" fill="#4c1d95">shuffle / tree</text><text x="420" y="252" font-size="15" fill="#4c1d95">源 lane 必须有效</text><text x="420" y="282" font-size="14" fill="#475569">一个 warp partial</text>
    <rect x="600" y="150" width="190" height="150" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="695" y="188" font-size="19" fill="#0f172a">shared memory</text><text x="695" y="222" font-size="16" fill="#78350f">各 warp 写 partial</text><text x="695" y="252" font-size="15" fill="#78350f">block barrier</text><text x="695" y="282" font-size="14" fill="#475569">同步后再读</text>
    <rect x="875" y="150" width="190" height="150" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="970" y="188" font-size="19" fill="#0f172a">block 归约</text><text x="970" y="222" font-size="16" fill="#14532d">warp partials → sum</text><text x="970" y="252" font-size="15" fill="#14532d">或 max / norm</text><text x="970" y="282" font-size="14" fill="#475569">单一 block 结果</text>
    <rect x="1090" y="190" width="75" height="70" rx="13" fill="#fce7f3" stroke="#db2777" stroke-width="2"/><text x="1127" y="232" font-size="17" fill="#831843">out</text>
  </g>
  <g fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arr)"><path d="M245 225H320"/><path d="M515 225H595"/><path d="M790 225H870"/><path d="M1065 225H1085"/></g>
  <text x="48" y="385" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16" fill="#475569">左框索引是 4-thread toy：tᵢ 累加 xᵢ, xᵢ₊₄…；真实 warp 通常有 32 lanes，并非 4 线程。</text><text x="48" y="420" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16" fill="#475569">跨 block 通常还需 global partial + 后续 kernel；树形跨度、active mask、padding 与同步点决定正确性。</text>
</svg>
