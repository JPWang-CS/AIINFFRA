<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">PagedAttention 的逻辑 block 到物理 KV block 映射</title>
  <desc id="desc">请求按逻辑 token block 排列，通过 block table 映射到非连续物理内存；追加 token 时按需分配 block，共享前缀写入时可 copy-on-write。</desc>
  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><rect width="1200" height="540" fill="#f8fafc"/><text x="48" y="52" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="27" font-weight="700" fill="#0f172a">逻辑连续序列由 block table 映射到非连续 KV 空间</text>
  <g font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">
    <text x="225" y="115" font-size="18" fill="#334155">请求 A 的逻辑 blocks</text><rect x="55" y="140" width="120" height="70" fill="#dbeafe" stroke="#2563eb"/><rect x="175" y="140" width="120" height="70" fill="#dbeafe" stroke="#2563eb"/><rect x="295" y="140" width="120" height="70" fill="#dbeafe" stroke="#2563eb"/><text x="115" y="181" font-size="17" fill="#1e3a8a">L₀</text><text x="235" y="181" font-size="17" fill="#1e3a8a">L₁</text><text x="355" y="181" font-size="17" fill="#1e3a8a">L₂</text>
    <rect x="500" y="130" width="210" height="105" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="605" y="154" font-size="18" fill="#0f172a">Block table</text><text x="605" y="181" font-size="15" fill="#4c1d95">L₀ → P₂</text><text x="605" y="204" font-size="15" fill="#4c1d95">L₁ → P₇</text><text x="605" y="227" font-size="15" fill="#4c1d95">L₂ → P₄</text>
    <text x="930" y="115" font-size="18" fill="#334155">物理 KV blocks</text><rect x="800" y="140" width="120" height="70" fill="#f1f5f9" stroke="#64748b"/><rect x="920" y="140" width="120" height="70" fill="#dcfce7" stroke="#16a34a"/><rect x="1040" y="140" width="120" height="70" fill="#f1f5f9" stroke="#64748b"/><rect x="800" y="230" width="120" height="70" fill="#f1f5f9" stroke="#64748b"/><rect x="920" y="230" width="120" height="70" fill="#dbeafe" stroke="#2563eb"/><rect x="1040" y="230" width="120" height="70" fill="#f1f5f9" stroke="#64748b"/><rect x="800" y="320" width="120" height="70" fill="#dcfce7" stroke="#16a34a"/><rect x="920" y="320" width="120" height="70" fill="#f1f5f9" stroke="#64748b"/><rect x="1040" y="320" width="120" height="70" fill="#dbeafe" stroke="#2563eb"/><text x="860" y="181" font-size="17" fill="#475569">P₀</text><text x="980" y="181" font-size="17" fill="#14532d">P₂</text><text x="1100" y="181" font-size="17" fill="#475569">P₁</text><text x="860" y="271" font-size="17" fill="#475569">P₃</text><text x="980" y="271" font-size="17" fill="#1e3a8a">P₇</text><text x="1100" y="271" font-size="17" fill="#475569">P₅</text><text x="860" y="361" font-size="17" fill="#14532d">P₄</text><text x="980" y="361" font-size="17" fill="#475569">P₆</text><text x="1100" y="361" font-size="17" fill="#1e3a8a">P₉</text>
  </g>
  <g fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)"><path d="M710 174H915"/><path d="M710 199H760V265H915"/><path d="M710 222H735V355H795"/></g>
  <rect x="55" y="430" width="500" height="65" rx="12" fill="#fff7ed" stroke="#fb923c"/><text x="305" y="457" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="17" fill="#7c2d12">追加 token：末 block 有空位就写；否则申请新物理 block</text><text x="305" y="482" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="14" fill="#7c2d12">逻辑相邻不要求物理相邻</text>
  <rect x="610" y="430" width="550" height="65" rx="12" fill="#fce7f3" stroke="#db2777"/><text x="885" y="457" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="17" fill="#831843">共享前缀：增加引用；分叉写入时 copy-on-write</text><text x="885" y="482" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="14" fill="#831843">attention 数学不变，allocator 与 block table 改变</text>
</svg>
