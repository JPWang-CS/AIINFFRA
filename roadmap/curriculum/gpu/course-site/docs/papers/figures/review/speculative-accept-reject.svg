<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">投机解码的分布校正、接受、拒绝与回滚</title>
  <desc id="desc">草稿分布 q 产生候选，目标分布 p 并行验证；候选按 min(1,p/q) 接受，拒绝时从归一化的正残差 max(p-q,0) 采样纠正 token，并丢弃后缀和暂存 KV。</desc>
  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><rect width="1200" height="590" fill="#f8fafc"/><text x="48" y="52" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="27" font-weight="700" fill="#0f172a">Draft → Verify：提交最长接受前缀，拒绝处修正并回滚</text>
  <g font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">
    <rect x="45" y="125" width="190" height="86" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="140" y="160" font-size="19" fill="#0f172a">草稿模型 q</text><text x="140" y="190" font-size="15" fill="#1e3a8a">候选 y₁…yₖ</text>
    <rect x="300" y="125" width="190" height="86" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="395" y="160" font-size="19" fill="#0f172a">目标模型 p</text><text x="395" y="190" font-size="15" fill="#4c1d95">并行计算位置分布</text>
    <rect x="555" y="125" width="240" height="86" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="675" y="160" font-size="18" fill="#0f172a">接受判定</text><text x="675" y="190" font-size="17" fill="#78350f">a = min(1, p(y)/q(y))</text>
    <rect x="860" y="85" width="275" height="110" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="997" y="126" font-size="19" fill="#0f172a">接受</text><text x="997" y="158" font-size="16" fill="#14532d">继续检查后续候选</text><text x="997" y="181" font-size="14" fill="#14532d">全接受时可取 bonus token</text>
    <rect x="860" y="270" width="275" height="120" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="997" y="310" font-size="19" fill="#0f172a">拒绝第 j 个候选</text><text x="997" y="342" font-size="16" fill="#7f1d1d">从 max(p−q,0) 归一化采样</text><text x="997" y="370" font-size="14" fill="#7f1d1d">得到目标分布校正 token</text>
    <rect x="555" y="305" width="240" height="86" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="675" y="340" font-size="18" fill="#0f172a">commit / rollback</text><text x="675" y="370" font-size="15" fill="#475569">提交前缀，丢弃后缀 KV</text>
    <rect x="300" y="430" width="495" height="84" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="547" y="466" font-size="17" fill="#334155">已接受前缀 + correction / bonus token</text><text x="547" y="494" font-size="15" fill="#475569">下一轮 context → draft q</text>
  </g>
  <g fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arr)"><path d="M235 168H295"/><path d="M490 168H550"/><path d="M795 150H855"/><path d="M675 212V242H830V330H855"/><path d="M860 348H800"/><path d="M675 391V425"/><path d="M1135 150H1170V420H547V430"/><path d="M547 514V520H20V168H40"/></g>
  <text x="805" y="135" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="14" fill="#475569">rand &lt; a</text><text x="805" y="235" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="14" fill="#475569">rand ≥ a</text><text x="860" y="411" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="14" fill="#475569">全部候选通过 / bonus</text>
  <text x="48" y="556" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16" fill="#475569">Greedy 验证可比较 argmax；随机采样需按概率执行接受/拒绝，不能用 argmax 相等替代。</text>
</svg>
