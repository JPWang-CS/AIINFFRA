<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">权重、激活与 KV cache 的量化分组</title>
  <desc id="desc">权重按输出通道或 group 保存静态 scale，激活按 token 或 group 计算 scale，KV cache 按 head、block 或 channel group 写入 scale 与低位 payload。</desc>
  <rect width="1200" height="520" fill="#f8fafc"/><text x="48" y="54" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="27" font-weight="700" fill="#0f172a">scale 粒度由张量轴与写读路径决定</text>
  <g font-family="Segoe UI,Microsoft YaHei,sans-serif">
    <rect x="45" y="88" width="1110" height="112" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="72" y="126" font-size="21" font-weight="700" fill="#0f172a">权重 W [K,N]</text><text x="72" y="160" font-size="16" fill="#475569">per-output-channel / per-group</text>
    <g><rect x="450" y="111" width="120" height="62" fill="#dbeafe" stroke="#2563eb"/><rect x="570" y="111" width="120" height="62" fill="#bfdbfe" stroke="#2563eb"/><rect x="690" y="111" width="120" height="62" fill="#dbeafe" stroke="#2563eb"/><rect x="810" y="111" width="120" height="62" fill="#bfdbfe" stroke="#2563eb"/><text x="510" y="148" text-anchor="middle" font-size="15" fill="#1e3a8a">组 0</text><text x="630" y="148" text-anchor="middle" font-size="15" fill="#1e3a8a">组 1</text><text x="750" y="148" text-anchor="middle" font-size="15" fill="#1e3a8a">组 2</text><text x="870" y="148" text-anchor="middle" font-size="15" fill="#1e3a8a">组 3</text><text x="1000" y="148" font-size="17" fill="#1e3a8a">scale 随权重存储</text></g>
    <rect x="45" y="218" width="1110" height="112" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="72" y="256" font-size="21" font-weight="700" fill="#0f172a">激活 X [B,S,D]</text><text x="72" y="290" font-size="16" fill="#475569">per-token / per-group</text>
    <g><rect x="450" y="241" width="120" height="62" fill="#fef3c7" stroke="#d97706"/><rect x="570" y="241" width="120" height="62" fill="#fde68a" stroke="#d97706"/><rect x="690" y="241" width="120" height="62" fill="#fef3c7" stroke="#d97706"/><rect x="810" y="241" width="120" height="62" fill="#fde68a" stroke="#d97706"/><text x="510" y="278" text-anchor="middle" font-size="15" fill="#78350f">token 0</text><text x="630" y="278" text-anchor="middle" font-size="15" fill="#78350f">token 1</text><text x="750" y="278" text-anchor="middle" font-size="15" fill="#78350f">token 2</text><text x="870" y="278" text-anchor="middle" font-size="15" fill="#78350f">token 3</text><text x="1000" y="278" font-size="17" fill="#78350f">scale 动态或校准固定</text></g>
    <rect x="45" y="348" width="1110" height="112" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="72" y="386" font-size="21" font-weight="700" fill="#0f172a">KV [L,B,H,T,D]</text><text x="72" y="420" font-size="16" fill="#475569">per-head / block / channel group</text>
    <g><rect x="450" y="371" width="120" height="62" fill="#dcfce7" stroke="#16a34a"/><rect x="570" y="371" width="120" height="62" fill="#bbf7d0" stroke="#16a34a"/><rect x="690" y="371" width="120" height="62" fill="#dcfce7" stroke="#16a34a"/><rect x="810" y="371" width="120" height="62" fill="#bbf7d0" stroke="#16a34a"/><text x="510" y="408" text-anchor="middle" font-size="15" fill="#14532d">block 0</text><text x="630" y="408" text-anchor="middle" font-size="15" fill="#14532d">block 1</text><text x="750" y="408" text-anchor="middle" font-size="15" fill="#14532d">block 2</text><text x="870" y="408" text-anchor="middle" font-size="15" fill="#14532d">block 3</text><text x="1000" y="408" font-size="17" fill="#14532d">写入 payload + scale</text></g>
  </g>
  <text x="48" y="495" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16" fill="#475569">颜色区分张量来源；量化位宽相同也不保证 scale 轴、读取方式或误差相同。</text>
</svg>
