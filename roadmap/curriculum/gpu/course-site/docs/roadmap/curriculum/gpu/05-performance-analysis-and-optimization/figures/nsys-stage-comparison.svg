<svg xmlns="http://www.w3.org/2000/svg" width="960" height="335" viewBox="0 0 960 335" role="img" aria-labelledby="title desc"><title id="title">MatMul s3与s2实验</title><desc id="desc">RTX3090，IEEE FP32，M8192 N6144 K4096。各60个大shape kernel。s3均值21.208284350ms，s2均值22.361580217ms。两者255寄存器每线程。</desc><rect width="960" height="335" fill="#fbfcfe"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif" fill="#17324d"><text x="28" y="35" font-size="21" font-weight="700">shared 减少，不代表这个 kernel 更快</text><text x="28" y="65" font-size="14" fill="#526b82">RTX 3090 · IEEE FP32 · M=8192, N=6144, K=4096 · 每组 60 个大 shape 调用</text><path d="M130 92V227" stroke="#dee7ef"/><text x="130" y="251" text-anchor="middle" font-size="13">0</text><path d="M252 92V227" stroke="#dee7ef"/><text x="252" y="251" text-anchor="middle" font-size="13">5</text><path d="M374 92V227" stroke="#dee7ef"/><text x="374" y="251" text-anchor="middle" font-size="13">10</text><path d="M496 92V227" stroke="#dee7ef"/><text x="496" y="251" text-anchor="middle" font-size="13">15</text><path d="M618 92V227" stroke="#dee7ef"/><text x="618" y="251" text-anchor="middle" font-size="13">20</text><path d="M740 92V227" stroke="#dee7ef"/><text x="740" y="251" text-anchor="middle" font-size="13">25</text><text x="74" y="134" font-size="17">s3</text><rect x="130" y="110" width="517.48213814" height="35" rx="4" fill="#247d93"/><text x="658.48213814" y="134" font-size="15">21.208 ms</text><text x="74" y="204" font-size="17">s2</text><rect x="130" y="180" width="545.6225572948" height="35" rx="4" fill="#9b6470"/><text x="686.6225572948" y="204" font-size="15">22.362 ms</text><text x="780" y="251" font-size="13">kernel mean</text><text x="28" y="288" font-size="14">Reg/Trd：255 → 255　　Dynamic shared（原报告舍入）：0.098 → 0.049 MB</text><text x="28" y="314" font-size="14" fill="#526b82">s2 mean 增加约 5.44%；流水深度影响是待检验解释，不是这张图单独证明的因果。</text></g></svg>
