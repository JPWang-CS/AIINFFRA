<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="370" viewBox="0 0 1100 370" role="img" aria-labelledby="title desc">
<title id="title">连续 FP32 warp 访问的固定 32B sector 边界</title>
<desc id="desc">32 lane 各读一个连续 4 字节 FP32。上行从32B对齐基址加0B开始，四个sector各8格，分组lane范围为0到7、8到15、16到23、24到31。下行从同一基址加4B开始，保持sector边界坐标不变；首格未使用，lane0从第二格起，lane31在第五个sector第一格，末尾7格未使用。</desc>
<style>
text{font-family:"Microsoft YaHei","Segoe UI",sans-serif}
.canvas{fill:#f7f9fc}
.title{font-size:28px;font-weight:700;fill:#18324b}
.base{font-size:24px;font-weight:700;fill:#18324b}
.count{font-size:18px;fill:#526b82}
.note,.sector-label{font-size:17px;fill:#526b82}
.range{font-size:17px;font-weight:600;fill:#18324b}
.cell{stroke:#fff;stroke-width:1.5}
.sector0,.sector2{fill:#d9eaf5}.sector1,.sector3{fill:#b9d6e8}.sector4{fill:#f0c8c1}
.unused{fill:#d3d8dd}.boundary{stroke:#376a91;stroke-width:3}
@media(prefers-color-scheme:dark){
 .canvas{fill:#101820}
 .title,.base,.range{fill:#e7edf4}
 .count,.note,.sector-label{fill:#b5c3d1}
 .sector0,.sector2{fill:#214052}.sector1,.sector3{fill:#2b4d63}.sector4{fill:#6c3935}
 .unused{fill:#35404a}.boundary{stroke:#91abc1}.cell{stroke:#101820}
}
</style>
<rect class="canvas" width="1100" height="370"/>
<text class="title" x="22" y="36">单条 warp：32 lane，各读一个连续 FP32（每 lane 4B）</text>
<text class="note" x="22" y="64">sector 边界固定且上下对齐，每组 8 格 = 32B；组内标出 lane 范围。</text>
<text class="base" x="22" y="132">对齐基址 + 0B</text><text class="count" x="22" y="158">4 sectors</text>
