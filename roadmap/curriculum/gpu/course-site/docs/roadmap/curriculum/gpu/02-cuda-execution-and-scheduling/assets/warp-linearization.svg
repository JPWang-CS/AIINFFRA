<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 610" role="img" aria-labelledby="title desc">
  <title id="title">线程块按线性编号划分 warp</title>
  <desc id="desc">先看 block(4,2) 的两行四列八个线程，再看 block(16,4) 的四行十六列六十四个线程。warp 0 的外框包住 y=0 和 y=1，warp 1 的外框包住 y=2 和 y=3。</desc>
  <defs><style>
    text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;fill:#172033}
    .title{font-size:22px;font-weight:700}.label{font-size:18px;font-weight:600}.note{font-size:18px;fill:#334155}
    .cell{fill:#102a43;stroke:#fff;stroke-width:2}.white{fill:#fff;font-size:18px}
    .warp0{fill:none;stroke:#176b87;stroke-width:4}.warp1{fill:none;stroke:#9a4f00;stroke-width:4}
  </style></defs>
  <rect width="800" height="610" rx="16" fill="#fff"/>
  <text x="28" y="36" class="title">一个 block 内，x 先变化；线性编号每 32 个分一组</text>
  <text x="28" y="68" class="label">block(4,2)：两行四列，共 8 个线程；tid = x + 4y</text>
  <text x="48" y="119" class="label">y=0</text><text x="48" y="175" class="label">y=1</text>
  <g transform="translate(125,82)">
    <rect x="0" y="0" width="64" height="48" rx="5" class="cell"/><text x="32" y="21" text-anchor="middle" class="white">tid 0</text><text x="32" y="42" text-anchor="middle" class="white">x=0</text>
    <rect x="64" y="0" width="64" height="48" rx="5" class="cell"/><text x="96" y="21" text-anchor="middle" class="white">tid 1</text><text x="96" y="42" text-anchor="middle" class="white">x=1</text>
    <rect x="128" y="0" width="64" height="48" rx="5" class="cell"/><text x="160" y="21" text-anchor="middle" class="white">tid 2</text><text x="160" y="42" text-anchor="middle" class="white">x=2</text>
    <rect x="192" y="0" width="64" height="48" rx="5" class="cell"/><text x="224" y="21" text-anchor="middle" class="white">tid 3</text><text x="224" y="42" text-anchor="middle" class="white">x=3</text>
    <rect x="0" y="56" width="64" height="48" rx="5" class="cell"/><text x="32" y="77" text-anchor="middle" class="white">tid 4</text><text x="32" y="98" text-anchor="middle" class="white">x=0</text>
    <rect x="64" y="56" width="64" height="48" rx="5" class="cell"/><text x="96" y="77" text-anchor="middle" class="white">tid 5</text><text x="96" y="98" text-anchor="middle" class="white">x=1</text>
    <rect x="128" y="56" width="64" height="48" rx="5" class="cell"/><text x="160" y="77" text-anchor="middle" class="white">tid 6</text><text x="160" y="98" text-anchor="middle" class="white">x=2</text>
    <rect x="192" y="56" width="64" height="48" rx="5" class="cell"/><text x="224" y="77" text-anchor="middle" class="white">tid 7</text><text x="224" y="98" text-anchor="middle" class="white">x=3</text>
  </g>
  <text x="28" y="222" class="note">8 个线程占一个 warp 的前 8 个 lane；另一个 block 不会补齐这组线程。</text>
  <text x="28" y="270" class="label">block(16,4)：四行，每行 x=0…15；tid = x + 16y</text>
  <g transform="translate(128,290)">
    <rect x="-6" y="-6" width="594" height="96" rx="9" class="warp0"/>
    <text x="-12" y="25" text-anchor="end" class="label">y=0</text>
    <text x="-12" y="69" text-anchor="end" class="label">y=1</text>
    <rect x="0" y="0" width="36" height="40" class="cell"/><text x="18" y="27" text-anchor="middle" class="white">0</text><rect x="36" y="0" width="36" height="40" class="cell"/><text x="54" y="27" text-anchor="middle" class="white">1</text><rect x="72" y="0" width="36" height="40" class="cell"/><text x="90" y="27" text-anchor="middle" class="white">2</text><rect x="108" y="0" width="36" height="40" class="cell"/><text x="126" y="27" text-anchor="middle" class="white">3</text><rect x="144" y="0" width="36" height="40" class="cell"/><text x="162" y="27" text-anchor="middle" class="white">4</text><rect x="180" y="0" width="36" height="40" class="cell"/><text x="198" y="27" text-anchor="middle" class="white">5</text><rect x="216" y="0" width="36" height="40" class="cell"/><text x="234" y="27" text-anchor="middle" class="white">6</text><rect x="252" y="0" width="36" height="40" class="cell"/><text x="270" y="27" text-anchor="middle" class="white">7</text><rect x="288" y="0" width="36" height="40" class="cell"/><text x="306" y="27" text-anchor="middle" class="white">8</text><rect x="324" y="0" width="36" height="40" class="cell"/><text x="342" y="27" text-anchor="middle" class="white">9</text><rect x="360" y="0" width="36" height="40" class="cell"/><text x="378" y="27" text-anchor="middle" class="white">10</text><rect x="396" y="0" width="36" height="40" class="cell"/><text x="414" y="27" text-anchor="middle" class="white">11</text><rect x="432" y="0" width="36" height="40" class="cell"/><text x="450" y="27" text-anchor="middle" class="white">12</text><rect x="468" y="0" width="36" height="40" class="cell"/><text x="486" y="27" text-anchor="middle" class="white">13</text><rect x="504" y="0" width="36" height="40" class="cell"/><text x="522" y="27" text-anchor="middle" class="white">14</text><rect x="540" y="0" width="36" height="40" class="cell"/><text x="558" y="27" text-anchor="middle" class="white">15</text>
    <rect x="0" y="44" width="36" height="40" class="cell"/><text x="18" y="71" text-anchor="middle" class="white">16</text><rect x="36" y="44" width="36" height="40" class="cell"/><text x="54" y="71" text-anchor="middle" class="white">17</text><rect x="72" y="44" width="36" height="40" class="cell"/><text x="90" y="71" text-anchor="middle" class="white">18</text><rect x="108" y="44" width="36" height="40" class="cell"/><text x="126" y="71" text-anchor="middle" class="white">19</text><rect x="144" y="44" width="36" height="40" class="cell"/><text x="162" y="71" text-anchor="middle" class="white">20</text><rect x="180" y="44" width="36" height="40" class="cell"/><text x="198" y="71" text-anchor="middle" class="white">21</text><rect x="216" y="44" width="36" height="40" class="cell"/><text x="234" y="71" text-anchor="middle" class="white">22</text><rect x="252" y="44" width="36" height="40" class="cell"/><text x="270" y="71" text-anchor="middle" class="white">23</text><rect x="288" y="44" width="36" height="40" class="cell"/><text x="306" y="71" text-anchor="middle" class="white">24</text><rect x="324" y="44" width="36" height="40" class="cell"/><text x="342" y="71" text-anchor="middle" class="white">25</text><rect x="360" y="44" width="36" height="40" class="cell"/><text x="378" y="71" text-anchor="middle" class="white">26</text><rect x="396" y="44" width="36" height="40" class="cell"/><text x="414" y="71" text-anchor="middle" class="white">27</text><rect x="432" y="44" width="36" height="40" class="cell"/><text x="450" y="71" text-anchor="middle" class="white">28</text><rect x="468" y="44" width="36" height="40" class="cell"/><text x="486" y="71" text-anchor="middle" class="white">29</text><rect x="504" y="44" width="36" height="40" class="cell"/><text x="522" y="71" text-anchor="middle" class="white">30</text><rect x="540" y="44" width="36" height="40" class="cell"/><text x="558" y="71" text-anchor="middle" class="white">31</text>
    <rect x="-6" y="-6" width="594" height="96" rx="9" class="warp0"/>
    <rect x="-6" y="104" width="594" height="96" rx="9" class="warp1"/>
    <text x="-12" y="135" text-anchor="end" class="label">y=2</text><text x="-12" y="179" text-anchor="end" class="label">y=3</text>
    <g transform="translate(0,110)">
      <rect x="0" y="0" width="36" height="40" class="cell"/><text x="18" y="27" text-anchor="middle" class="white">32</text><rect x="36" y="0" width="36" height="40" class="cell"/><text x="54" y="27" text-anchor="middle" class="white">33</text><rect x="72" y="0" width="36" height="40" class="cell"/><text x="90" y="27" text-anchor="middle" class="white">34</text><rect x="108" y="0" width="36" height="40" class="cell"/><text x="126" y="27" text-anchor="middle" class="white">35</text><rect x="144" y="0" width="36" height="40" class="cell"/><text x="162" y="27" text-anchor="middle" class="white">36</text><rect x="180" y="0" width="36" height="40" class="cell"/><text x="198" y="27" text-anchor="middle" class="white">37</text><rect x="216" y="0" width="36" height="40" class="cell"/><text x="234" y="27" text-anchor="middle" class="white">38</text><rect x="252" y="0" width="36" height="40" class="cell"/><text x="270" y="27" text-anchor="middle" class="white">39</text><rect x="288" y="0" width="36" height="40" class="cell"/><text x="306" y="27" text-anchor="middle" class="white">40</text><rect x="324" y="0" width="36" height="40" class="cell"/><text x="342" y="27" text-anchor="middle" class="white">41</text><rect x="360" y="0" width="36" height="40" class="cell"/><text x="378" y="27" text-anchor="middle" class="white">42</text><rect x="396" y="0" width="36" height="40" class="cell"/><text x="414" y="27" text-anchor="middle" class="white">43</text><rect x="432" y="0" width="36" height="40" class="cell"/><text x="450" y="27" text-anchor="middle" class="white">44</text><rect x="468" y="0" width="36" height="40" class="cell"/><text x="486" y="27" text-anchor="middle" class="white">45</text><rect x="504" y="0" width="36" height="40" class="cell"/><text x="522" y="27" text-anchor="middle" class="white">46</text><rect x="540" y="0" width="36" height="40" class="cell"/><text x="558" y="27" text-anchor="middle" class="white">47</text>
      <rect x="0" y="44" width="36" height="40" class="cell"/><text x="18" y="71" text-anchor="middle" class="white">48</text><rect x="36" y="44" width="36" height="40" class="cell"/><text x="54" y="71" text-anchor="middle" class="white">49</text><rect x="72" y="44" width="36" height="40" class="cell"/><text x="90" y="71" text-anchor="middle" class="white">50</text><rect x="108" y="44" width="36" height="40" class="cell"/><text x="126" y="71" text-anchor="middle" class="white">51</text><rect x="144" y="44" width="36" height="40" class="cell"/><text x="162" y="71" text-anchor="middle" class="white">52</text><rect x="180" y="44" width="36" height="40" class="cell"/><text x="198" y="71" text-anchor="middle" class="white">53</text><rect x="216" y="44" width="36" height="40" class="cell"/><text x="234" y="71" text-anchor="middle" class="white">54</text><rect x="252" y="44" width="36" height="40" class="cell"/><text x="270" y="71" text-anchor="middle" class="white">55</text><rect x="288" y="44" width="36" height="40" class="cell"/><text x="306" y="71" text-anchor="middle" class="white">56</text><rect x="324" y="44" width="36" height="40" class="cell"/><text x="342" y="71" text-anchor="middle" class="white">57</text><rect x="360" y="44" width="36" height="40" class="cell"/><text x="378" y="71" text-anchor="middle" class="white">58</text><rect x="396" y="44" width="36" height="40" class="cell"/><text x="414" y="71" text-anchor="middle" class="white">59</text><rect x="432" y="44" width="36" height="40" class="cell"/><text x="450" y="71" text-anchor="middle" class="white">60</text><rect x="468" y="44" width="36" height="40" class="cell"/><text x="486" y="71" text-anchor="middle" class="white">61</text><rect x="504" y="44" width="36" height="40" class="cell"/><text x="522" y="71" text-anchor="middle" class="white">62</text><rect x="540" y="44" width="36" height="40" class="cell"/><text x="558" y="71" text-anchor="middle" class="white">63</text>
    </g>
    <rect x="-6" y="104" width="594" height="96" rx="9" class="warp1"/>
  </g>
  <text x="28" y="550" class="note">蓝框 warp 0：y=0/1，tid 0–31；橙框 warp 1：y=2/3，tid 32–63。</text>
  <text x="28" y="578" class="note">下图每行 16 格，格内数字为 tid；列坐标 x 从左到右为 0…15。</text>
</svg>
