<svg xmlns="http://www.w3.org/2000/svg" width="960" height="335" viewBox="0 0 960 335" role="img" aria-labelledby="title desc"><title id="title">双缓冲slot生命周期</title><desc id="desc">每个slot依次经历host填充、H2D、kernel、D2H、event完成。下一次复用同slot必须等event完成。图中宽度不是实测时间。</desc><rect width="960" height="335" fill="#fbfcfe"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif" fill="#17324d"><text x="28" y="35" font-size="21" font-weight="700">能否复用 buffer，看最后一次使用是否结束</text><text x="28" y="65" font-size="14" fill="#526b82">依赖示意，不表示实测时间或保证两条 stream 一定重叠。</text><text x="28" y="132" font-size="16">slot 0</text><rect x="115" y="102" width="117" height="47" rx="5" fill="#e4edf6" stroke="#9aafc3"/><text x="173" y="131" text-anchor="middle" font-size="15">填充输入</text><path d="M235 125h10m-4 -4l4 4 -4 4" fill="none" stroke="#587489" stroke-width="1.5"/><rect x="248" y="102" width="117" height="47" rx="5" fill="#e4edf6" stroke="#9aafc3"/><text x="306" y="131" text-anchor="middle" font-size="15">H2D</text><path d="M368 125h10m-4 -4l4 4 -4 4" fill="none" stroke="#587489" stroke-width="1.5"/><rect x="381" y="102" width="117" height="47" rx="5" fill="#e4edf6" stroke="#9aafc3"/><text x="439" y="131" text-anchor="middle" font-size="15">kernel</text><path d="M501 125h10m-4 -4l4 4 -4 4" fill="none" stroke="#587489" stroke-width="1.5"/><rect x="514" y="102" width="117" height="47" rx="5" fill="#e4edf6" stroke="#9aafc3"/><text x="572" y="131" text-anchor="middle" font-size="15">D2H</text><path d="M634 125h10m-4 -4l4 4 -4 4" fill="none" stroke="#587489" stroke-width="1.5"/><rect x="647" y="102" width="117" height="47" rx="5" fill="#d4ede2" stroke="#3d8c75"/><text x="705" y="131" text-anchor="middle" font-size="15">event完成</text><path d="M767 125h10m-4 -4l4 4 -4 4" fill="none" stroke="#587489" stroke-width="1.5"/><rect x="780" y="102" width="117" height="47" rx="5" fill="#fff1d9" stroke="#9aafc3"/><text x="838" y="131" text-anchor="middle" font-size="15">允许复用</text><text x="28" y="223" font-size="16">slot 1</text><rect x="115" y="193" width="117" height="47" rx="5" fill="#e4edf6" stroke="#9aafc3"/><text x="173" y="222" text-anchor="middle" font-size="15">填充输入</text><path d="M235 216h10m-4 -4l4 4 -4 4" fill="none" stroke="#587489" stroke-width="1.5"/><rect x="248" y="193" width="117" height="47" rx="5" fill="#e4edf6" stroke="#9aafc3"/><text x="306" y="222" text-anchor="middle" font-size="15">H2D</text><path d="M368 216h10m-4 -4l4 4 -4 4" fill="none" stroke="#587489" stroke-width="1.5"/><rect x="381" y="193" width="117" height="47" rx="5" fill="#e4edf6" stroke="#9aafc3"/><text x="439" y="222" text-anchor="middle" font-size="15">kernel</text><path d="M501 216h10m-4 -4l4 4 -4 4" fill="none" stroke="#587489" stroke-width="1.5"/><rect x="514" y="193" width="117" height="47" rx="5" fill="#e4edf6" stroke="#9aafc3"/><text x="572" y="222" text-anchor="middle" font-size="15">D2H</text><path d="M634 216h10m-4 -4l4 4 -4 4" fill="none" stroke="#587489" stroke-width="1.5"/><rect x="647" y="193" width="117" height="47" rx="5" fill="#d4ede2" stroke="#3d8c75"/><text x="705" y="222" text-anchor="middle" font-size="15">event完成</text><path d="M767 216h10m-4 -4l4 4 -4 4" fill="none" stroke="#587489" stroke-width="1.5"/><rect x="780" y="193" width="117" height="47" rx="5" fill="#fff1d9" stroke="#9aafc3"/><text x="838" y="222" text-anchor="middle" font-size="15">允许复用</text><text x="28" y="298" font-size="14" fill="#526b82">H2D 读取 host 输入；D2H 写入 host 输出。CPU 写输入或读输出前，都要满足对应完成条件。</text></g></svg>
