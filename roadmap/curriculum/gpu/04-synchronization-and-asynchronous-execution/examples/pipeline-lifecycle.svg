<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" role="img" aria-labelledby="t d"><title id="t">Ring buffer lifetime</title><desc id="d">A shared-memory slot must be free before copy, ready before use, and released by its last reader before reuse in a new generation.</desc><rect width="900" height="280" rx="15" fill="#f8fafc"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#668098"/></marker></defs><g font-family="Segoe UI,Arial,sans-serif"><text x="32" y="36" font-size="21" fill="#172c46" font-weight="650">One slot · four lifetime states</text><rect x="32" y="75" width="175" height="76" rx="9" fill="white" stroke="#bdcddd"/><text x="119" y="106" text-anchor="middle" font-size="18" font-weight="600" fill="#244867">EMPTY</text><text x="119" y="130" text-anchor="middle" font-size="12" fill="#546b80">previous readers finished</text><path d="M212 113H243" stroke="#668098" stroke-width="2" marker-end="url(#arrow)"/><rect x="252" y="75" width="175" height="76" rx="9" fill="white" stroke="#bdcddd"/><text x="339" y="106" text-anchor="middle" font-size="18" font-weight="600" fill="#244867">IN_FLIGHT</text><text x="339" y="130" text-anchor="middle" font-size="12" fill="#546b80">copy submitted</text><path d="M432 113H463" stroke="#668098" stroke-width="2" marker-end="url(#arrow)"/><rect x="472" y="75" width="175" height="76" rx="9" fill="#e5efff" stroke="#bdcddd"/><text x="559" y="106" text-anchor="middle" font-size="18" font-weight="600" fill="#244867">READY</text><text x="559" y="130" text-anchor="middle" font-size="12" fill="#546b80">copy completion observed</text><path d="M652 113H683" stroke="#668098" stroke-width="2" marker-end="url(#arrow)"/><rect x="692" y="75" width="175" height="76" rx="9" fill="white" stroke="#bdcddd"/><text x="779" y="106" text-anchor="middle" font-size="18" font-weight="600" fill="#244867">READING</text><text x="779" y="130" text-anchor="middle" font-size="12" fill="#546b80">consumer owns the data</text><path d="M780 159V209H120V159" fill="none" stroke="#668098" stroke-width="2" marker-end="url(#arrow)"/><text x="450" y="201" text-anchor="middle" font-size="16" fill="#244867">last reader finishes → release → next generation</text><text x="32" y="257" font-size="14" fill="#546b80">Copy completion permits reading. Reader completion permits overwrite. These are different events.</text></g></svg>
