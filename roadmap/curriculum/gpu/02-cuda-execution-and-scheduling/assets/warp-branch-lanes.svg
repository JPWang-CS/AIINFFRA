<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="350" viewBox="0 0 1040 350" role="img" aria-labelledby="title desc">
<title id="title">一个 warp 的 32 个 lane 分两条分支路径执行</title>
<desc id="desc">lane 0 到 31 对应连续 global_id。偶数 lane 参加 even 路径的 FMA，奇数 lane 参加 odd 路径的 FMA。若编译器保留分支，两组路径分别发出指令；每个线程只计算所选路径，之后回到共同写回。</desc>
<defs><style>text{font-family:Segoe UI,Microsoft YaHei,sans-serif;fill:#26394f}.title{font-size:24px;font-weight:650}.small{font-size:14px;fill:#53677d}.label{font-size:16px;font-weight:600}.lane{stroke:#fff;stroke-width:2}.even{fill:#dce9fa}.odd{fill:#f6e5c9}.box{fill:#fff;stroke:#cad5e2;stroke-width:1.5}.blue{fill:#315f9f}.orange{fill:#9a6321}.arrow{stroke:#73849a;stroke-width:2;fill:none;marker-end:url(#arr)}.canvas{fill:#f8fafc}.merge{fill:#e8edf3;stroke:#b9c6d5}@media(prefers-color-scheme:dark){text{fill:#e6edf5}.title,.label{fill:#edf4fc}.small{fill:#c0ccda}.canvas{fill:#111827}.lane{stroke:#111827}.even{fill:#273b56}.odd{fill:#51402b}.box{fill:#17212e;stroke:#71849c}.merge{fill:#293545;stroke:#6e8096}.arrow{stroke:#9aabc0}}</style><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#73849a"/></marker></defs>
<rect class="canvas" width="1040" height="350" rx="18"/>
<text x="32" y="42" class="title">分支按活动 lane 分组处理</text>
<text x="32" y="68" class="small">此例 global_id=lane；蓝色执行 even，橙色执行 odd。</text>
<text x="32" y="112" class="label">lane</text>
<g transform="translate(110,88)" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="13" font-weight="600">
 <g class="blue">
  <rect x="0" y="0" width="25" height="38" class="lane even"/><text x="12.5" y="24" fill="#315f9f">0</text><rect x="50" y="0" width="25" height="38" class="lane even"/><text x="62.5" y="24" fill="#315f9f">2</text><rect x="100" y="0" width="25" height="38" class="lane even"/><text x="112.5" y="24" fill="#315f9f">4</text><rect x="150" y="0" width="25" height="38" class="lane even"/><text x="162.5" y="24" fill="#315f9f">6</text><rect x="200" y="0" width="25" height="38" class="lane even"/><text x="212.5" y="24" fill="#315f9f">8</text><rect x="250" y="0" width="25" height="38" class="lane even"/><text x="262.5" y="24" fill="#315f9f">10</text><rect x="300" y="0" width="25" height="38" class="lane even"/><text x="312.5" y="24" fill="#315f9f">12</text><rect x="350" y="0" width="25" height="38" class="lane even"/><text x="362.5" y="24" fill="#315f9f">14</text><rect x="400" y="0" width="25" height="38" class="lane even"/><text x="412.5" y="24" fill="#315f9f">16</text><rect x="450" y="0" width="25" height="38" class="lane even"/><text x="462.5" y="24" fill="#315f9f">18</text><rect x="500" y="0" width="25" height="38" class="lane even"/><text x="512.5" y="24" fill="#315f9f">20</text><rect x="550" y="0" width="25" height="38" class="lane even"/><text x="562.5" y="24" fill="#315f9f">22</text><rect x="600" y="0" width="25" height="38" class="lane even"/><text x="612.5" y="24" fill="#315f9f">24</text><rect x="650" y="0" width="25" height="38" class="lane even"/><text x="662.5" y="24" fill="#315f9f">26</text><rect x="700" y="0" width="25" height="38" class="lane even"/><text x="712.5" y="24" fill="#315f9f">28</text><rect x="750" y="0" width="25" height="38" class="lane even"/><text x="762.5" y="24" fill="#315f9f">30</text>
 </g>
 <g>
  <rect x="25" y="0" width="25" height="38" class="lane odd"/><text x="37.5" y="24" fill="#9a6321">1</text><rect x="75" y="0" width="25" height="38" class="lane odd"/><text x="87.5" y="24" fill="#9a6321">3</text><rect x="125" y="0" width="25" height="38" class="lane odd"/><text x="137.5" y="24" fill="#9a6321">5</text><rect x="175" y="0" width="25" height="38" class="lane odd"/><text x="187.5" y="24" fill="#9a6321">7</text><rect x="225" y="0" width="25" height="38" class="lane odd"/><text x="237.5" y="24" fill="#9a6321">9</text><rect x="275" y="0" width="25" height="38" class="lane odd"/><text x="287.5" y="24" fill="#9a6321">11</text><rect x="325" y="0" width="25" height="38" class="lane odd"/><text x="337.5" y="24" fill="#9a6321">13</text><rect x="375" y="0" width="25" height="38" class="lane odd"/><text x="387.5" y="24" fill="#9a6321">15</text><rect x="425" y="0" width="25" height="38" class="lane odd"/><text x="437.5" y="24" fill="#9a6321">17</text><rect x="475" y="0" width="25" height="38" class="lane odd"/><text x="487.5" y="24" fill="#9a6321">19</text><rect x="525" y="0" width="25" height="38" class="lane odd"/><text x="537.5" y="24" fill="#9a6321">21</text><rect x="575" y="0" width="25" height="38" class="lane odd"/><text x="587.5" y="24" fill="#9a6321">23</text><rect x="625" y="0" width="25" height="38" class="lane odd"/><text x="637.5" y="24" fill="#9a6321">25</text><rect x="675" y="0" width="25" height="38" class="lane odd"/><text x="687.5" y="24" fill="#9a6321">27</text><rect x="725" y="0" width="25" height="38" class="lane odd"/><text x="737.5" y="24" fill="#9a6321">29</text><rect x="775" y="0" width="25" height="38" class="lane odd"/><text x="787.5" y="24" fill="#9a6321">31</text>
 </g>
</g>
<text x="110" y="147" class="small">蓝色：16 个偶数 lane</text><text x="310" y="147" class="small">橙色：16 个奇数 lane</text>
<path d="M330 162V190H245V205" class="arrow"/><path d="M660 162V190H795V205" class="arrow"/>
<rect x="92" y="210" width="310" height="62" rx="10" class="box"/><text x="247" y="236" text-anchor="middle" class="label" fill="#315f9f">even 路径指令</text><text x="247" y="258" text-anchor="middle" class="small">16 个偶数 lane 活动</text>
<rect x="638" y="210" width="310" height="62" rx="10" class="box"/><text x="793" y="236" text-anchor="middle" class="label" fill="#9a6321">odd 路径指令</text><text x="793" y="258" text-anchor="middle" class="small">16 个奇数 lane 活动</text>
<path d="M247 272V292H520" class="arrow"/><path d="M793 272V292H520" class="arrow"/><rect x="350" y="291" width="340" height="38" rx="8" class="merge"/><text x="520" y="316" text-anchor="middle" class="label">每个 lane 写自己的 output[global_id]</text>
</svg>
