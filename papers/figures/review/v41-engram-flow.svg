<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Engram 的确定性查表与上下文门控</title>
  <desc id="desc">输入 token 形成压缩 ID，生成多种 n-gram 哈希地址，查 FP8 embedding；当前 hidden state 计算上下文门控后注入 residual stream。</desc>
  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><rect width="1200" height="520" fill="#f8fafc"/><text x="48" y="52" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="27" font-weight="700" fill="#0f172a">Engram：可预取地址，内容仍由当前上下文门控</text>
  <g font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">
    <rect x="40" y="190" width="145" height="82" rx="13" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="112" y="225" font-size="19" fill="#0f172a">Token IDs</text><text x="112" y="251" font-size="15" fill="#1e3a8a">序列状态</text>
    <rect x="225" y="190" width="170" height="82" rx="13" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/><text x="310" y="225" font-size="18" fill="#0f172a">Tokenizer</text><text x="310" y="251" font-size="15" fill="#312e81">压缩 ID</text>
    <rect x="435" y="165" width="190" height="132" rx="13" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="530" y="205" font-size="18" fill="#0f172a">多阶 n-gram</text><text x="530" y="237" font-size="16" fill="#78350f">2 / 3 / 4-gram</text><text x="530" y="268" font-size="16" fill="#78350f">8 hash heads / 阶</text>
    <rect x="670" y="190" width="160" height="82" rx="13" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="750" y="225" font-size="18" fill="#0f172a">哈希地址</text><text x="750" y="251" font-size="15" fill="#7c2d12">可提前确定</text>
    <rect x="875" y="190" width="160" height="82" rx="13" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="955" y="225" font-size="18" fill="#0f172a">FP8 表查找</text><text x="955" y="251" font-size="15" fill="#14532d">预取 / scale</text>
    <rect x="430" y="360" width="200" height="82" rx="13" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="530" y="395" font-size="18" fill="#0f172a">当前 hidden states</text><text x="530" y="421" font-size="15" fill="#4c1d95">上下文依赖</text>
    <rect x="690" y="350" width="200" height="102" rx="13" fill="#fce7f3" stroke="#db2777" stroke-width="2"/><text x="790" y="389" font-size="18" fill="#0f172a">Context gate</text><text x="790" y="419" font-size="15" fill="#831843">Gate(x,k) × value</text>
    <rect x="960" y="350" width="190" height="102" rx="13" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><text x="1055" y="389" font-size="18" fill="#0f172a">Residual streams</text><text x="1055" y="419" font-size="15" fill="#334155">+ gated memory</text>
  </g>
  <g fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arr)"><path d="M185 231H220"/><path d="M395 231H430"/><path d="M625 231H665"/><path d="M830 231H870"/><path d="M1035 231H1080V310H790V345"/><path d="M630 401H685"/><path d="M890 401H955"/></g>
  <text x="48" y="488" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16" fill="#475569">V4.1 保留 n-gram、多头哈希、上下文门控与多分支整合，并移除短因果卷积。</text>
</svg>
