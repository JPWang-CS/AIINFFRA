<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">SageAttention3 降低 operand 精度，Kascade 复用跨层索引</title>
  <desc id="desc">SageAttention3 使用 NVFP4 微缩放执行 QK、PV 矩阵乘并处理概率块 scale；Kascade 在 anchor layers 选择 top-k positions，在相邻 reuse layers 重用选择。</desc>
  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><rect width="1400" height="560" viewBox="0 0 1400 560" fill="#f8fafc"/><text x="48" y="52" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="27" font-weight="700" fill="#0f172a">两种方法分别改变矩阵乘精度与跨层访问集合</text>
  <g font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">
    <rect x="40" y="90" width="640" height="390" rx="16" fill="#fff" stroke="#cbd5e1"/><text x="360" y="132" font-size="22" font-weight="700" fill="#0f172a">SageAttention3 · NVFP4 micro-scaling</text>
    <rect x="720" y="90" width="640" height="390" rx="16" fill="#fff" stroke="#cbd5e1"/><text x="1040" y="132" font-size="22" font-weight="700" fill="#0f172a">Kascade · Anchor / Reuse</text>
    <rect x="55" y="195" width="110" height="78" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="110" y="228" font-size="17" fill="#1e3a8a">Q / K</text><text x="110" y="253" font-size="14" fill="#1e3a8a">FP4 + scale</text>
    <rect x="195" y="195" width="115" height="78" rx="12" fill="#ede9fe" stroke="#7c3aed"/><text x="252" y="228" font-size="16" fill="#4c1d95">QKᵀ</text><text x="252" y="253" font-size="14" fill="#4c1d95">FP4MM</text>
    <rect x="340" y="195" width="145" height="78" rx="12" fill="#fef3c7" stroke="#d97706"/><text x="412" y="228" font-size="15" fill="#78350f">缩放 + Softmax</text><text x="412" y="253" font-size="14" fill="#78350f">P</text>
    <rect x="515" y="195" width="145" height="78" rx="12" fill="#ffedd5" stroke="#ea580c"/><text x="587" y="228" font-size="17" fill="#7c2d12">P @ V</text><text x="587" y="253" font-size="14" fill="#7c2d12">矩阵乘 · FP4 scales</text>
    <text x="360" y="340" font-size="16" fill="#475569">P 需处理量化 scale；误差与 tile / scale 相关</text><text x="360" y="375" font-size="15" fill="#64748b">payload 位宽不等于流量和时间等比例下降</text>
    <rect x="755" y="190" width="170" height="82" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="840" y="225" font-size="18" fill="#1e3a8a">Anchor layer</text><text x="840" y="253" font-size="15" fill="#1e3a8a">score → Top-K</text>
    <rect x="1010" y="190" width="145" height="82" rx="12" fill="#dcfce7" stroke="#16a34a"/><text x="1082" y="225" font-size="18" fill="#14532d">Reuse layer</text><text x="1082" y="253" font-size="15" fill="#14532d">复用位置</text>
    <rect x="1200" y="190" width="125" height="82" rx="12" fill="#ffedd5" stroke="#ea580c"/><text x="1262" y="225" font-size="17" fill="#7c2d12">gather</text><text x="1262" y="253" font-size="14" fill="#7c2d12">稀疏 KV</text>
    <text x="1040" y="340" font-size="16" fill="#475569">跨层映射由 anchor selection 产生</text><text x="1040" y="375" font-size="15" fill="#64748b">质量取决于层间重要位置稳定性</text>
  </g>
  <g fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arr)"><path d="M165 234H190"/><path d="M310 234H335"/><path d="M485 234H510"/><path d="M925 231H1005"/><path d="M1155 231H1195"/></g>
  <text x="48" y="525" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16" fill="#475569">SageAttention3 论文报告的数值有指定 GPU/baseline；Kascade 报告 attention 子系统的收益，二者不是同口径全模型加速。</text>
</svg>
