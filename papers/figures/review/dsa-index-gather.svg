<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">DSA 的索引打分、位置选择与主 Attention gather</title>
  <desc id="desc">Indexer 为 query 对可见历史条目打分并选择位置；主 Attention 根据位置 gather 对应 latent/KV entries，再在选中集合上计算并归一化。</desc>
  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><rect width="1200" height="520" fill="#f8fafc"/><text x="48" y="52" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="27" font-weight="700" fill="#0f172a">DSA 选择历史位置，再 gather 主注意力条目</text>
  <g font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">
    <rect x="50" y="115" width="220" height="92" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="160" y="153" font-size="19" fill="#0f172a">Indexer Q</text><text x="160" y="183" font-size="15" fill="#1e3a8a">当前 query</text>
    <rect x="50" y="280" width="220" height="92" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="160" y="318" font-size="19" fill="#0f172a">Indexer K</text><text x="160" y="348" font-size="15" fill="#14532d">可见历史条目</text>
    <rect x="360" y="195" width="200" height="100" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="460" y="235" font-size="19" fill="#0f172a">score + Top-K</text><text x="460" y="267" font-size="16" fill="#4c1d95">输出位置索引 I</text>
    <rect x="655" y="115" width="220" height="92" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="765" y="153" font-size="19" fill="#0f172a">Main KV / latent</text><text x="765" y="183" font-size="15" fill="#78350f">按原位置存储</text>
    <rect x="655" y="280" width="220" height="92" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="765" y="318" font-size="19" fill="#0f172a">gather(I)</text><text x="765" y="348" font-size="15" fill="#7c2d12">只取选择的位置</text>
    <rect x="935" y="85" width="200" height="78" rx="13" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="1035" y="119" font-size="18" fill="#1e3a8a">Main Query</text><text x="1035" y="145" font-size="14" fill="#1e3a8a">主 Attention 的 Q</text>
    <rect x="965" y="195" width="190" height="100" rx="14" fill="#fce7f3" stroke="#db2777" stroke-width="2"/><text x="1060" y="235" font-size="19" fill="#0f172a">主 Attention</text><text x="1060" y="267" font-size="15" fill="#831843">softmax → weighted V</text>
  </g>
  <g fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arr)"><path d="M270 161H340V220H355"/><path d="M270 326H340V270H355"/><path d="M560 245H610V326H650"/><path d="M765 207V275"/><path d="M875 326H920V245H960"/><path d="M1035 163V190"/></g>
  <text x="48" y="440" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16" fill="#475569">索引器的全历史评分成本仍需计入；被选条目少，不代表整条路径都只按 K 扫描。</text>
</svg>
