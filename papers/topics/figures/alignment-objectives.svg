<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470" role="img" aria-labelledby="t d">
<title id="t">监督微调、偏好比较和策略优化使用不同监督信号</title>
<desc id="d">SFT在目标回答token上计算交叉熵；DPO比较同prompt下优选和拒选序列相对参考策略的log ratio；PPO或GRPO根据奖励和优势更新策略。三种目标是并列方法。</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.b{stroke-width:2;rx:14}.x{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#a)}.h{font-size:20px;font-weight:700}.s{font-size:16px}</style></defs>
<rect width="1080" height="470" fill="#f8fafc"/><text x="40" y="42" class="h">三类目标接收不同监督信号</text>
<rect x="45" y="96" width="300" height="275" class="b" fill="#eff6ff" stroke="#3b82f6"/><text x="195" y="137" text-anchor="middle" class="h">SFT</text><text x="195" y="179" text-anchor="middle" class="s">prompt + 示范回答</text><path d="M195 196V235" class="x"/><rect x="95" y="247" width="200" height="78" class="b" fill="#dbeafe" stroke="#3b82f6"/><text x="195" y="280" text-anchor="middle" class="h">目标 token NLL</text><text x="195" y="306" text-anchor="middle" class="s">mask=1 的位置求梯度</text>
<rect x="390" y="96" width="300" height="275" class="b" fill="#f5f3ff" stroke="#8b5cf6"/><text x="540" y="137" text-anchor="middle" class="h">DPO</text><text x="540" y="179" text-anchor="middle" class="s">同 prompt 的 winner / loser</text><path d="M540 196V235" class="x"/><rect x="440" y="247" width="200" height="78" class="b" fill="#ede9fe" stroke="#8b5cf6"/><text x="540" y="280" text-anchor="middle" class="h">策略 / 参考比值</text><text x="540" y="306" text-anchor="middle" class="s">拉大偏好 log-ratio</text>
<rect x="735" y="96" width="300" height="275" class="b" fill="#f0fdf4" stroke="#22c55e"/><text x="885" y="137" text-anchor="middle" class="h">PPO / GRPO</text><text x="885" y="179" text-anchor="middle" class="s">策略采样 + 奖励</text><path d="M885 196V235" class="x"/><rect x="785" y="247" width="200" height="78" class="b" fill="#dcfce7" stroke="#22c55e"/><text x="885" y="280" text-anchor="middle" class="h">优势 A 与 ratio</text><text x="885" y="306" text-anchor="middle" class="s">裁剪策略梯度更新</text>
<rect x="100" y="402" width="880" height="44" rx="12" fill="#e2e8f0"/><text x="540" y="431" text-anchor="middle" class="s">三种目标可用于不同后训练阶段；奖励、mask 和参考策略决定有效梯度</text>
</svg>
