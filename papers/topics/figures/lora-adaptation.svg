<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="t d">
<title id="t">LoRA冻结底座与低秩增量在加法节点汇合</title>
<desc id="d">输入分到冻结W0主支路和可训练A、B低秩支路，两支路在加法处汇合得到输出；推理时可将BA合并进W0。</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.b{stroke-width:2;rx:14}.x{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#a)}.h{font-size:20px;font-weight:700}.s{font-size:16px}</style></defs>
<rect width="1000" height="430" fill="#f8fafc"/><text x="40" y="42" class="h">同一输入经过冻结底座和可训练低秩支路</text>
<rect x="46" y="150" width="110" height="72" class="b" fill="#dbeafe" stroke="#3b82f6"/><text x="101" y="193" text-anchor="middle" class="h">x</text>
<path d="M156 186H220M220 186V114H285M220 186V270H285" class="x"/>
<rect x="297" y="78" width="250" height="72" class="b" fill="#e2e8f0" stroke="#64748b"/><text x="422" y="108" text-anchor="middle" class="h">冻结 W₀</text><text x="422" y="132" text-anchor="middle" class="s">xW₀ᵀ</text>
<rect x="297" y="234" width="130" height="72" class="b" fill="#ede9fe" stroke="#8b5cf6"/><text x="362" y="264" text-anchor="middle" class="h">Aᵀ</text><text x="362" y="288" text-anchor="middle" class="s">dᵢₙ → r</text>
<rect x="462" y="234" width="130" height="72" class="b" fill="#dcfce7" stroke="#22c55e"/><text x="527" y="264" text-anchor="middle" class="h">Bᵀ</text><text x="527" y="288" text-anchor="middle" class="s">r → dₒᵤₜ</text><text x="527" y="222" text-anchor="middle" class="s">s = α/r</text>
<path d="M427 270H462M547 114H650V171" class="x"/>
<circle cx="674" cy="186" r="27" fill="#fff" stroke="#475569" stroke-width="2"/><text x="674" y="194" text-anchor="middle" class="h">+</text>
<path d="M592 270H674V213M701 186H800" class="x"/>
<rect x="812" y="150" width="145" height="72" class="b" fill="#ffedd5" stroke="#f97316"/><text x="884" y="193" text-anchor="middle" class="h">y</text>
<rect x="297" y="344" width="420" height="52" class="b" fill="#fef3c7" stroke="#d97706"/><text x="507" y="376" text-anchor="middle" class="s">部署可合并：Wₘₑᵣgₑd = W₀ + (α/r)BA</text>
</svg>
