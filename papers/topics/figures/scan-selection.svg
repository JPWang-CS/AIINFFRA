<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470" role="img" aria-labelledby="t d">
<title id="t">并行前缀 scan 与分层 Top-k 合并</title><desc id="d">Scan通过有序分块归约和前缀传播得到结果；分层Top-k中每个block的本地候选先汇入bus，再共同进入全局合并。</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.b{stroke-width:2;rx:12}.x{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#a)}.line{fill:none;stroke:#475569;stroke-width:2}.h{font-size:20px;font-weight:700}.s{font-size:16px}</style></defs>
<rect width="1080" height="470" fill="#f8fafc"/><text x="40" y="42" class="h">两种常见的树形并行算法</text><text x="50" y="90" class="h">Prefix scan</text>
<g text-anchor="middle"><rect x="65" y="112" width="90" height="54" class="b" fill="#dbeafe" stroke="#3b82f6"/><text x="110" y="146" class="s">2</text><rect x="195" y="112" width="90" height="54" class="b" fill="#dbeafe" stroke="#3b82f6"/><text x="240" y="146" class="s">1</text><rect x="325" y="112" width="90" height="54" class="b" fill="#dbeafe" stroke="#3b82f6"/><text x="370" y="146" class="s">3</text><rect x="455" y="112" width="90" height="54" class="b" fill="#dbeafe" stroke="#3b82f6"/><text x="500" y="146" class="s">4</text></g>
<path d="M110 166V204H240V166M370 166V204H500V166" class="line"/><rect x="166" y="210" width="148" height="52" class="b" fill="#ffedd5" stroke="#f97316"/><text x="240" y="242" text-anchor="middle" class="s">局部和 3</text><rect x="426" y="210" width="148" height="52" class="b" fill="#ffedd5" stroke="#f97316"/><text x="500" y="242" text-anchor="middle" class="s">局部和 7</text><path d="M240 262V292H370M500 262V292H370V310" class="line"/><rect x="280" y="310" width="180" height="46" class="b" fill="#ede9fe" stroke="#8b5cf6"/><text x="370" y="340" text-anchor="middle" class="s">upsweep total = 10</text><text x="300" y="389" text-anchor="middle" class="s">downsweep 传播前缀：2 · 3 · 6 · 10</text>
<line x1="600" y1="88" x2="600" y2="408" stroke="#cbd5e1" stroke-width="2"/><text x="650" y="91" class="h">分层 Top-k</text>
<rect x="650" y="125" width="145" height="62" class="b" fill="#ede9fe" stroke="#8b5cf6"/><text x="722" y="162" text-anchor="middle" class="s">Block 1 本地 top-k</text><rect x="650" y="220" width="145" height="62" class="b" fill="#ede9fe" stroke="#8b5cf6"/><text x="722" y="257" text-anchor="middle" class="s">Block 2 本地 top-k</text><rect x="650" y="315" width="145" height="62" class="b" fill="#ede9fe" stroke="#8b5cf6"/><text x="722" y="352" text-anchor="middle" class="s">Block n 本地 top-k</text>
<path d="M795 156H840M795 251H840M795 346H840M840 156V346" class="line"/><path d="M840 251H857" class="x"/><rect x="857" y="210" width="170" height="82" class="b" fill="#dcfce7" stroke="#22c55e"/><text x="942" y="245" text-anchor="middle" class="h">合并候选</text><text x="942" y="272" text-anchor="middle" class="s">再取全局 top-k</text>
<text x="835" y="420" text-anchor="middle" class="s">每块至少保留 k 个；统一 tie-break 后候选并集覆盖全局 top-k</text></svg>
