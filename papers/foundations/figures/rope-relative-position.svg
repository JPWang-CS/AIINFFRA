<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#365f91"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5a9a7d"/></marker></defs><rect width="1200" height="620" fill="#f7f9fc"/><text x="48" y="54" font-family="Microsoft YaHei,Arial" font-size="28" font-weight="700" fill="#172b4d">RoPE：绝对位置旋转，点积依赖相对位移</text>
<g font-family="Microsoft YaHei,Arial" text-anchor="middle"><rect x="50" y="150" width="180" height="90" rx="12" fill="#e5edf7" stroke="#86a3c5" stroke-width="2"/><text x="140" y="187" font-size="21" fill="#172b4d">内容投影</text><text x="140" y="218" font-family="Consolas" font-size="17" fill="#40536b">q_m, k_n</text><rect x="310" y="105" width="210" height="90" rx="12" fill="#dceee7" stroke="#5a9a7d" stroke-width="2"/><text x="415" y="142" font-size="20" fill="#17543a">位置 m 旋转 Q</text><text x="415" y="173" font-family="Consolas" font-size="18" fill="#17543a">R(mθ) q_m</text><rect x="310" y="245" width="210" height="90" rx="12" fill="#dceee7" stroke="#5a9a7d" stroke-width="2"/><text x="415" y="282" font-size="20" fill="#17543a">位置 n 旋转 K</text><text x="415" y="313" font-family="Consolas" font-size="18" fill="#17543a">R(nθ) k_n</text><rect x="610" y="150" width="190" height="100" rx="12" fill="#fff2cf" stroke="#d3a544" stroke-width="2"/><text x="705" y="190" font-size="20" fill="#5b4215">点积</text><text x="705" y="222" font-family="Consolas" font-size="18" fill="#5b4215">q̃_mᵀ k̃_n</text><rect x="885" y="150" width="260" height="100" rx="12" fill="#e5edf7" stroke="#86a3c5" stroke-width="2"/><text x="1015" y="190" font-size="20" fill="#172b4d">相对位置形式</text><text x="1015" y="222" font-family="Consolas" font-size="18" fill="#172b4d">q_mᵀ R((n−m)θ) k_n</text></g>
<g fill="none" stroke="#365f91" stroke-width="3" marker-end="url(#a)"><path d="M230 170 C260 170 275 150 305 150"/><path d="M230 220 C260 260 275 290 305 290"/><path d="M520 150 C565 150 565 180 605 185"/><path d="M520 290 C570 290 565 225 605 215"/><path d="M800 200 L880 200"/></g>
<rect x="45" y="365" width="315" height="205" rx="12" fill="#fff" stroke="#c8d3e0" stroke-width="2"/><text x="65" y="393" font-family="Microsoft YaHei,Arial" font-size="18" font-weight="700" fill="#172b4d">一对通道按角度旋转</text><g fill="none"><path d="M85 520 L290 520" stroke="#8a98a8" stroke-width="2" marker-end="url(#a)"/><path d="M130 550 L130 420" stroke="#8a98a8" stroke-width="2" marker-end="url(#a)"/><path d="M130 520 L245 465" stroke="#365f91" stroke-width="4" marker-end="url(#a)"/><path d="M130 520 L220 430" stroke="#5a9a7d" stroke-width="4" marker-end="url(#g)"/><path d="M184 494 A62 62 0 0 0 175 475" stroke="#d3a544" stroke-width="3"/></g><text x="248" y="466" font-family="Consolas,Arial" font-size="16" fill="#365f91">z</text><text x="220" y="420" font-family="Consolas,Arial" font-size="16" fill="#17543a">R(pθ)z</text><text x="186" y="480" font-family="Consolas,Arial" font-size="15" fill="#8a641b">pθ</text><text x="70" y="548" font-family="Microsoft YaHei,Arial" font-size="14" fill="#40536b">蓝：旋转前；绿：旋转后</text>
<text x="405" y="430" font-family="Consolas,Arial" font-size="24" fill="#172b4d">R(mθ)ᵀ R(nθ) = R((n−m)θ)</text><text x="405" y="482" font-family="Consolas,Arial" font-size="21" fill="#172b4d">q̃_mᵀ k̃_n = q_mᵀ R((n−m)θ) k_n</text><text x="405" y="545" font-family="Microsoft YaHei,Arial" font-size="17" fill="#40536b">每对通道使用一个频率；多对二维旋转组成 head 维上的 block-diagonal 旋转。</text></svg>
