<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#365f91"/></marker></defs><rect width="1200" height="760" fill="#f7f9fc"/><text x="48" y="48" font-family="Microsoft YaHei,Arial" font-size="28" font-weight="700" fill="#172b4d">两个稠密 decoder 的完整数据路径</text>
<rect x="35" y="78" width="550" height="635" rx="16" fill="#fff" stroke="#c8d3e0" stroke-width="2"/><rect x="615" y="78" width="550" height="635" rx="16" fill="#fff" stroke="#c8d3e0" stroke-width="2"/><text x="310" y="117" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="23" font-weight="700" fill="#172b4d">GPT-2 117M</text><text x="890" y="117" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="23" font-weight="700" fill="#172b4d">Llama 3.1 8B</text>
<g font-family="Microsoft YaHei,Arial" text-anchor="middle"><rect x="135" y="140" width="350" height="54" rx="9" fill="#e5edf7" stroke="#86a3c5"/><text x="310" y="174" font-size="18" fill="#172b4d">text → byte-level BPE IDs [T]</text><rect x="135" y="218" width="350" height="62" rx="9" fill="#dceee7" stroke="#5a9a7d"/><text x="310" y="245" font-size="17" fill="#17543a">token embedding + learned positions</text><text x="310" y="268" font-family="Consolas" font-size="15" fill="#17543a">D=768, context=1024</text>
<rect x="85" y="308" width="450" height="232" rx="12" fill="#fff8e8" stroke="#d3a544" stroke-width="2"/><text x="310" y="340" font-size="19" font-weight="700" fill="#5b4215">repeat 12 Pre-LN blocks</text><rect x="120" y="357" width="380" height="64" rx="8" fill="#fff2cf" stroke="#d3a544"/><text x="310" y="383" font-size="17" fill="#5b4215">LayerNorm → causal MHA → residual</text><text x="310" y="406" font-family="Consolas" font-size="15" fill="#5b4215">12 heads × 64; mask j ≤ i</text><rect x="120" y="439" width="380" height="76" rx="8" fill="#fff2cf" stroke="#d3a544"/><text x="310" y="467" font-size="17" fill="#5b4215">LayerNorm → GELU FFN → residual</text><text x="310" y="494" font-family="Consolas" font-size="15" fill="#5b4215">768 → 3072 → 768</text><rect x="135" y="566" width="350" height="52" rx="9" fill="#dceee7" stroke="#5a9a7d"/><text x="310" y="599" font-size="17" fill="#17543a">final LayerNorm</text><rect x="135" y="640" width="350" height="52" rx="9" fill="#e5edf7" stroke="#86a3c5"/><text x="310" y="672" font-size="17" fill="#172b4d">tied vocabulary projection → logits</text>
<rect x="715" y="140" width="350" height="54" rx="9" fill="#e5edf7" stroke="#86a3c5"/><text x="890" y="174" font-size="18" fill="#172b4d">text → tokenizer IDs [T]</text><rect x="715" y="218" width="350" height="62" rx="9" fill="#dceee7" stroke="#5a9a7d"/><text x="890" y="245" font-size="17" fill="#17543a">token embedding</text><text x="890" y="268" font-family="Consolas" font-size="15" fill="#17543a">D=4096, context=128K</text>
<rect x="665" y="308" width="450" height="232" rx="12" fill="#eef6f2" stroke="#5a9a7d" stroke-width="2"/><text x="890" y="340" font-size="19" font-weight="700" fill="#17543a">repeat 32 dense Pre-LN blocks</text><rect x="700" y="357" width="380" height="64" rx="8" fill="#dceee7" stroke="#5a9a7d"/><text x="890" y="383" font-size="17" fill="#17543a">RMSNorm → RoPE + causal GQA</text><text x="890" y="406" font-family="Consolas" font-size="15" fill="#17543a">Q heads=32; KV heads=8; residual</text><rect x="700" y="439" width="380" height="76" rx="8" fill="#dceee7" stroke="#5a9a7d"/><text x="890" y="467" font-size="17" fill="#17543a">RMSNorm → SwiGLU FFN → residual</text><text x="890" y="494" font-family="Consolas" font-size="15" fill="#17543a">4096 → 14336 → 4096</text><rect x="715" y="566" width="350" height="52" rx="9" fill="#dceee7" stroke="#5a9a7d"/><text x="890" y="599" font-size="17" fill="#17543a">final RMSNorm</text><rect x="715" y="640" width="350" height="52" rx="9" fill="#e5edf7" stroke="#86a3c5"/><text x="890" y="672" font-size="17" fill="#172b4d">vocabulary projection → logits</text></g>
<g fill="none" stroke="#365f91" stroke-width="2.5" marker-end="url(#a)"><path d="M310 194 L310 213"/><path d="M310 280 L310 303"/><path d="M310 540 L310 560"/><path d="M310 618 L310 635"/><path d="M890 194 L890 213"/><path d="M890 280 L890 303"/><path d="M890 540 L890 560"/><path d="M890 618 L890 635"/></g><text x="48" y="741" font-family="Microsoft YaHei,Arial" font-size="16" fill="#40536b">两个模型都在词表轴产生 next-token logits；位置、归一化、注意力头分组和 FFN 是各自的架构选择。</text></svg>
