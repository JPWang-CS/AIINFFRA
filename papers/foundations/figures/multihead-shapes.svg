<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#365f91"/></marker></defs><rect width="1200" height="500" fill="#f7f9fc"/><text x="48" y="54" font-family="Microsoft YaHei,Arial" font-size="28" font-weight="700" fill="#172b4d">多头注意力的张量形状</text>
<g font-family="Microsoft YaHei,Arial" text-anchor="middle"><rect x="50" y="190" width="170" height="110" rx="12" fill="#e5edf7" stroke="#86a3c5" stroke-width="2"/><text x="135" y="232" font-size="21" fill="#172b4d">隐藏态 X</text><text x="135" y="270" font-family="Consolas" font-size="19" fill="#40536b">[B,T,D]</text>
<rect x="285" y="190" width="190" height="110" rx="12" fill="#e5edf7" stroke="#86a3c5" stroke-width="2"/><text x="380" y="232" font-size="21" fill="#172b4d">Q / K / V</text><text x="380" y="270" font-family="Consolas" font-size="18" fill="#40536b">各 [B,T,D]</text>
<rect x="540" y="95" width="235" height="95" rx="12" fill="#dceee7" stroke="#5a9a7d" stroke-width="2"/><text x="657" y="132" font-size="20" fill="#17543a">reshape + transpose</text><text x="657" y="164" font-family="Consolas" font-size="18" fill="#17543a">[B,H,T,dh]</text>
<rect x="540" y="300" width="235" height="95" rx="12" fill="#fff2cf" stroke="#d3a544" stroke-width="2"/><text x="657" y="337" font-size="20" fill="#5b4215">每头独立 attention</text><text x="657" y="369" font-family="Consolas" font-size="18" fill="#5b4215">scores [B,H,T,T]</text>
<rect x="840" y="190" width="145" height="110" rx="12" fill="#e5edf7" stroke="#86a3c5" stroke-width="2"/><text x="912" y="232" font-size="20" fill="#172b4d">Concat heads</text><text x="912" y="270" font-family="Consolas" font-size="18" fill="#40536b">[B,T,D]</text>
<rect x="1030" y="190" width="135" height="110" rx="12" fill="#e5edf7" stroke="#86a3c5" stroke-width="2"/><text x="1097" y="232" font-size="19" fill="#172b4d">输出投影</text><text x="1097" y="270" font-family="Consolas" font-size="18" fill="#40536b">[B,T,D]</text></g>
<g fill="none" stroke="#365f91" stroke-width="3" marker-end="url(#a)"><path d="M220 245 L280 245"/><path d="M475 220 C505 220 510 142 535 142"/><path d="M657 190 L657 294"/><path d="M775 347 C810 347 808 245 835 245"/><path d="M985 245 L1025 245"/></g>
