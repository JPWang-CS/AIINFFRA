<text x="48" y="430" font-family="Microsoft YaHei,Arial" font-size="15" fill="#40536b">memory 由 encoder 产生，供 decoder cross-attention 读取。</text><text x="438" y="315" font-family="Microsoft YaHei,Arial" font-size="15" fill="#40536b">只看当前位置及其前缀；</text><text x="438" y="341" font-family="Microsoft YaHei,Arial" font-size="15" fill="#40536b">按 next-token 目标生成。</text><text x="827" y="315" font-family="Microsoft YaHei,Arial" font-size="15" fill="#40536b">每个位置可读左右上下文；</text><text x="827" y="341" font-family="Microsoft YaHei,Arial" font-size="15" fill="#40536b">常用 MLM 或分类目标。</text></svg>
