<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#365f91"/></marker></defs><rect width="1200" height="520" fill="#f7f9fc"/><text x="48" y="54" font-family="Microsoft YaHei,Arial" font-size="28" font-weight="700" fill="#172b4d">训练、prefill 与增量 decode 共用的因果位置规则</text>
<g font-family="Microsoft YaHei,Arial" text-anchor="middle"><rect x="55" y="120" width="250" height="140" rx="14" fill="#e5edf7" stroke="#86a3c5" stroke-width="2"/><text x="180" y="158" font-size="21" fill="#172b4d">Prefill：输入前缀</text><text x="180" y="195" font-family="Consolas" font-size="19" fill="#40536b">positions 0…P−1</text><text x="180" y="230" font-family="Consolas" font-size="17" fill="#40536b">每层生成 K,V cache</text>
<rect x="400" y="120" width="260" height="140" rx="14" fill="#dceee7" stroke="#5a9a7d" stroke-width="2"/><text x="530" y="158" font-size="21" fill="#17543a">Decode：新 query</text><text x="530" y="195" font-family="Consolas" font-size="19" fill="#17543a">position P, Tq=1</text><text x="530" y="230" font-family="Consolas" font-size="17" fill="#17543a">本层新 K,V 追加</text>
<rect x="755" y="120" width="245" height="140" rx="14" fill="#fff2cf" stroke="#d3a544" stroke-width="2"/><text x="877" y="158" font-size="21" fill="#5b4215">mask 判定</text><text x="877" y="195" font-family="Consolas" font-size="18" fill="#5b4215">allow(j ≤ P+i)</text><text x="877" y="230" font-size="17" fill="#5b4215">Tq=1 时可读全部 K</text>
<rect x="1050" y="120" width="105" height="140" rx="14" fill="#e5edf7" stroke="#86a3c5" stroke-width="2"/><text x="1102" y="170" font-size="19" fill="#172b4d">logits</text><text x="1102" y="207" font-family="Consolas" font-size="17" fill="#40536b">[B,1,V]</text></g>
<g fill="none" stroke="#365f91" stroke-width="3" marker-end="url(#a)"><path d="M305 190 L395 190"/><path d="M660 190 L750 190"/><path d="M1000 190 L1045 190"/></g>
<rect x="70" y="320" width="1070" height="115" rx="14" fill="#fff" stroke="#c8d3e0" stroke-width="2"/><text x="100" y="358" font-family="Microsoft YaHei,Arial" font-size="20" fill="#172b4d">正确性比较条件</text><text x="100" y="397" font-family="Microsoft YaHei,Arial" font-size="18" fill="#40536b">相同权重、eval 模式、dropout=0、绝对位置偏移正确、每层独立 cache、mask 使用真实 query/key 位置。</text><text x="100" y="418" font-family="Microsoft YaHei,Arial" font-size="16" fill="#40536b">逐 token 或分块 logits 应与 full-sequence 对应位置一致（浮点误差范围内）。</text></svg>
